name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Stable signing key (if the KEYSTORE_B64 secret is set)
        env: { KS_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS_B64" ]; then printf '%s' "$KS_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > $RUNNER_TEMP/sahra.jks; ls -l $RUNNER_TEMP/sahra.jks; echo "KS_FILE=$RUNNER_TEMP/sahra.jks" >> $GITHUB_ENV; fi
      - run: gradle assembleRelease --no-daemon
        env: { KS_PASS: '${{ secrets.KEYSTORE_PASS }}' }
      - run: cp app/build/outputs/apk/release/app-release.apk Mor.apk
      - uses: actions/upload-artifact@v4
        with: { name: Mor-apk, path: Mor.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mor APK
          files: Mor.apk
          make_latest: true
