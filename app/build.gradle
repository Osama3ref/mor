plugins { id 'com.android.application' }
android {
    namespace 'com.mor.cards'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mor.cards'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '1.17'
    }
    signingConfigs {
        stable {
            def ks = System.getenv('KS_FILE')
            if (ks) { storeFile file(ks); storePassword System.getenv('KS_PASS').trim(); keyAlias 'sahra'; keyPassword System.getenv('KS_PASS').trim() }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig System.getenv('KS_FILE') ? signingConfigs.stable : signingConfigs.debug } }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
