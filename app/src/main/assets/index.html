<style>
/* VOICE: a late-night majlis card evening, premium and calm
   IDEA: a private card salon: navy walls, gold trim, a green baize table under a warm lamp
   PICTURE: the table itself is the hero in every game; menus are gold-trimmed cards on navy
   COLOUR and TYPE: navy + gold + baize green (royal); 3 alternate skins; Cairo for Arabic, Playfair/Oswald for card indices
   LAYOUT: one primary action per screen, bottom nav on home, seats around an oval table, hand fanned at the bottom */
:root{--bg1:#16224a;--bg2:#070b1d;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.09);--line:rgba(217,180,90,.22);--line2:rgba(255,255,255,.1);
  --gold:#e2bf68;--gold2:#b58a2e;--ink:#f6f1e3;--dim:#a7aec4;--felt1:#18704b;--felt2:#0c4630;--rim1:#3a2a14;--rim2:#7a5a26;
  --a:#e2bf68;--b:#5fb8ec;--red:#d8343f;--ok:#3bbf7a;--btnink:#1d1404;--card:#fffdf7;--card2:#f3ecda;--cink:#15171c;--cred:#c8202d;
  color-scheme:dark}
:root[data-skin=classic]{--bg1:#4a2e1a;--bg2:#1c0f07;--panel:rgba(255,240,210,.06);--panel2:rgba(255,240,210,.1);--line:rgba(232,200,140,.25);--gold:#e8c07a;--gold2:#a77a35;--dim:#cbb79a;--felt1:#1f7a45;--felt2:#0f4a28;--rim1:#2a1408;--rim2:#8a5a2a;--a:#e8c07a;--b:#8fd0c0}
:root[data-skin=night]{--bg1:#16181d;--bg2:#050506;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(79,209,197,.25);--gold:#4fd1c5;--gold2:#2a8f87;--dim:#9aa3ad;--felt1:#13454a;--felt2:#081f22;--rim1:#0b0c0e;--rim2:#2d3238;--a:#4fd1c5;--b:#f6ad55;--btnink:#03201d}
:root[data-skin=vivid]{--bg1:#0f4c75;--bg2:#08223a;--panel:rgba(255,255,255,.08);--panel2:rgba(255,255,255,.13);--line:rgba(255,200,87,.35);--gold:#ffc857;--gold2:#ff7a59;--dim:#b9d3e6;--felt1:#22a06b;--felt2:#11663f;--rim1:#ff7a59;--rim2:#ffc857;--a:#ffc857;--b:#7be0ff;--btnink:#3a1800}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--bg1),var(--bg2) 70%);color:var(--ink);font:15px/1.5 Cairo,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;font-size:16px;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--ink);width:100%;user-select:text;-webkit-user-select:text}
input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--dim);font-size:13px}
.gold{color:var(--gold)}
h1,h2,h3{margin:0;line-height:1.2}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 18px;border-radius:14px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--btnink);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn svg,.chip svg,.li svg{width:20px;height:20px;flex:none}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:linear-gradient(180deg,#ef5a63,#b81f2b);color:#fff}
.btn.sky{background:linear-gradient(180deg,#86d2f4,#3a9fd0);color:#03202e}
.btn.sm{min-height:38px;padding:4px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;pointer-events:none}
.ic{width:40px;height:40px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line2)}
.ic svg{width:20px;height:20px}
.ic.on{background:var(--gold);color:var(--btnink)}
.ic.von{background:var(--b);color:#03212d}.ic.vmute{background:var(--red);color:#fff}
.badge{position:absolute;top:-5px;left:-5px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap}
.chip.on{background:var(--gold);color:var(--btnink);box-shadow:none}
.tag{display:inline-block;font-size:10.5px;padding:0 7px;border-radius:8px;background:rgba(0,0,0,.45);margin:1px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 140px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sep{height:1px;background:var(--line);margin:14px 0}
/* screens */
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:max(14px,env(safe-area-inset-top)) max(4vw,14px) 110px}
.scr .in{max-width:640px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{font-size:18px;margin-bottom:4px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hdr h1{font-size:24px;flex:1}
.brand{text-align:center;margin:10px 0 4px}
.brand h1{padding-bottom:8px;font:800 40px/1.25 Cairo,sans-serif;letter-spacing:-.5px;background:linear-gradient(180deg,#fff6dc,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .muted{font-size:14px}
.fanlogo{position:relative;margin:0 auto}
.fanlogo .c{position:absolute;bottom:0;transform-origin:50% 130%}
.me-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line2)}
.me-bar .nm{font-weight:800;font-size:16px}
.big-act{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:22px;text-align:start;margin:10px 0;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 10px 28px rgba(0,0,0,.28)}
.big-act.main{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--btnink);border:0}
.big-act .bi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(0,0,0,.18);flex:none}
.big-act.main .bi{background:rgba(255,255,255,.28)}
.big-act .bi svg{width:28px;height:28px}
.big-act b{display:block;font-size:19px}
.big-act span{font-size:13px;opacity:.8}
.big-act:active{transform:scale(.985)}
.resume{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.resume .chip{flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg2) 30%);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--dim);padding:6px 12px;border-radius:14px;position:relative;min-width:64px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--gold);background:var(--panel)}
.nav .badge{top:2px;left:12px}
/* avatar */
.avt{--s:44px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--s)*.44);color:#fff;flex:none;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.15)}
.avt img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avt.lg{--s:84px}.avt.sm{--s:34px}.avt.xs{--s:26px}
.avpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}
.avpick button{display:grid;place-items:center;padding:4px;border-radius:50%}
.avpick button.on .avt{box-shadow:0 0 0 3px var(--gold)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.swatches button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.swatches button.on{box-shadow:0 0 0 3px var(--gold)}
/* option tiles (themes, cards) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{border-radius:18px;padding:10px;background:var(--panel);border:1px solid var(--line2);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tile .sw{width:100%;height:54px;border-radius:12px;position:relative;overflow:hidden}
.tile .sw i{position:absolute;inset:auto 12% 10% 12%;height:46%;border-radius:40px/20px}
.tile .cards{display:flex;justify-content:center;direction:ltr}.tile .cards .c{--w:40px;margin:0 -6px}
/* games grid */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;margin-top:10px}
.gentry{position:relative;display:flex}
.gcard{width:100%;position:relative;padding:12px 10px 12px;border-radius:20px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:150px}
.gcard.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(0,0,0,.3)}
.gcard b{font-size:15.5px}.gcard .muted{font-size:11.5px;line-height:1.35}
.gentry .info{position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--gold)}
.gentry .info span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.4)}
.gentry .info:focus-visible{outline-offset:-3px}
.saved-games .resume{flex-wrap:wrap;overflow:visible;margin-top:9px}
.saved-games .chip{min-height:44px}
.ov.handoff{background:var(--bg2);backdrop-filter:none}
.gcard .saved{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);gap:4px}
.seg button{flex:1;min-height:38px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
/* room */
.roomcode{font:600 44px/1 Oswald,sans-serif;letter-spacing:8px;direction:ltr;color:var(--gold);text-align:center}
.minitable{position:relative;height:250px;margin:14px auto 4px;max-width:360px}
.minitable .felt{position:absolute;inset:48px 60px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--felt1),var(--felt2));box-shadow:0 0 0 7px var(--rim2),0 0 0 10px var(--rim1),0 18px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.4);display:grid;place-items:center;text-align:center;font-size:12px;color:rgba(255,255,255,.75)}
.minitable .st{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;width:96px;font-size:12px;font-weight:700}
.minitable .st.s0{bottom:0;left:50%;transform:translateX(-50%)}.minitable .st.s2{top:0;left:50%;transform:translateX(-50%)}
.minitable .st.s1{right:0;top:50%;transform:translateY(-50%)}.minitable .st.s3{left:0;top:50%;transform:translateY(-50%)}
.minitable .empty-seat{width:50px;height:50px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--gold);font-size:22px}
.minitable .st.me .avt{box-shadow:0 0 0 3px var(--gold)}
.minitable .team{font-size:10px;color:var(--dim)}
.spect{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gsel{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.gsel b{font-size:18px}
.gemo{display:grid;place-items:center;height:1.4em;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .t{flex:1}.li .t b{display:block;font-size:15px}.li .t span{font-size:12.5px;color:var(--dim)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:16px 0}
/* chat view */
.chatv{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.chatv .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2);background:var(--bg2)}
.chatv .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.chatv .inp{display:flex;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:var(--bg2)}
.msg{max-width:80%;padding:7px 12px;border-radius:16px;background:var(--panel2);align-self:flex-start;font-size:14.5px;user-select:text;-webkit-user-select:text}
.msg.me{align-self:flex-end;background:var(--gold);color:var(--btnink)}
.msg small{display:block;font-size:11px;opacity:.7;font-weight:700}
.msg.inv{border:1px solid var(--gold);background:var(--panel)}
.msg.me.inv{color:var(--ink)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(3,6,16,.66);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .15s;backdrop-filter:blur(3px)}
.ov.cen{align-items:center;padding:16px}
.box{background:linear-gradient(180deg,var(--bg1),var(--bg2));border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.5);animation:up .22s cubic-bezier(.2,.8,.3,1);touch-action:pan-y}
.ov.cen .box{border-radius:24px}
.box h2{font-size:21px;margin-bottom:6px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:-6px auto 12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:center}th:first-child,td:first-child{text-align:start}
.scroll{overflow-x:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1e2436;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:14px;z-index:90;font-weight:700;max-width:92vw;box-shadow:0 10px 28px rgba(0,0,0,.5);text-align:center;animation:pop .2s}
.rules p{margin:6px 0 10px;line-height:1.75;font-size:14.5px;user-select:text;-webkit-user-select:text}
.rank{display:flex;gap:12px;align-items:center}
.lvl{width:58px;height:58px;border-radius:18px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--btnink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.lvl b{font:600 24px/1 Oswald,sans-serif}.lvl span{font-size:10px;font-weight:700}
.mrow{padding:7px 0;border-bottom:1px solid var(--line2)}
input[type=range]{min-height:0;padding:0;accent-color:var(--gold);background:none;border:0}
/* ---------- cards ---------- */
.c{--w:56px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.11);background:linear-gradient(165deg,var(--card),var(--card2));color:var(--cink);position:relative;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.2);overflow:hidden;direction:ltr;text-align:left}
.c.r{color:var(--cred)}
.c .ix,.c .ix2{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;left:calc(var(--w)*.05);top:calc(var(--w)*.06);width:calc(var(--w)*.3)}
.c .ix b,.c .ix2 b{font:700 calc(var(--w)*.3)/1 'Playfair Display',Georgia,serif;letter-spacing:-1px}
.c .ix i,.c .ix2 i{font-style:normal;font-size:calc(var(--w)*.22);margin-top:1px}
.c .ix2{left:auto;top:auto;right:calc(var(--w)*.05);bottom:calc(var(--w)*.06);transform:rotate(180deg)}
.c .pips{position:absolute;inset:0;display:var(--pip)}
.c .pips i{position:absolute;font-style:normal;font-size:calc(var(--w)*.18);transform:translate(-50%,-50%);line-height:1}
.c .pips i.f{transform:translate(-50%,-50%) rotate(180deg)}
.c .ace{position:absolute;inset:0;place-items:center;font-size:calc(var(--w)*.62);display:var(--ace)}
.c .court{position:absolute;inset:calc(var(--w)*.2) calc(var(--w)*.19);border:1.5px solid currentColor;border-radius:calc(var(--w)*.06);flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(226,191,104,.28),rgba(226,191,104,.08));display:var(--court)}
.c .court svg{width:62%;height:auto}
.c .court b{font:800 calc(var(--w)*.3)/1 'Playfair Display',Georgia,serif}
.c .big{display:var(--big);position:absolute;right:calc(var(--w)*.06);bottom:calc(var(--w)*.02);font-size:calc(var(--w)*.62);line-height:1}
.c .ix2{display:var(--ix2)}
.c .ix b{font-size:calc(var(--w)*var(--ixb))}.c .ix i{font-size:calc(var(--w)*var(--ixi))}.c .ix{width:calc(var(--w)*var(--ixw))}
.c.s-S{color:var(--cS)}.c.s-C{color:var(--cC)}.c.s-H{color:var(--cH)}.c.s-D{color:var(--cD)}
[data-cards]{--pip:none;--ace:none;--court:none;--big:none;--ix2:block;--ixb:.3;--ixi:.22;--ixw:.3;--cS:var(--cink);--cC:var(--cink);--cH:var(--cred);--cD:var(--cred)}
[data-cards=classic]{--pip:block;--ace:grid;--court:flex;--ixb:.27;--ixi:.19;--ixw:.25}
[data-cards=modern]{--big:block;--ix2:none}
[data-cards=four]{--big:block;--ix2:none;--cD:#1d6fd6;--cC:#1b8a3c;--cH:#d0202d}
[data-cards=jumbo]{--ix2:none;--ixb:.5;--ixi:.4;--ixw:.5}
[data-cards=jumbo] .c .ix b{font-family:Oswald,sans-serif}
/* clear: bold oversized index readable in a tight fan, big suit at the bottom, court art kept */
[data-cards=clear]{--ix2:none;--big:block;--court:flex;--ace:none;--ixb:.46;--ixi:.36;--ixw:.42}
[data-cards=clear] .c{background:#fff;border:1px solid rgba(0,0,0,.18)}
[data-cards=clear] .c .ix{left:calc(var(--w)*.04);top:calc(var(--w)*.04)}
[data-cards=clear] .c .ix b{font:700 calc(var(--w)*.46)/.95 Oswald,'Arial Narrow',sans-serif;letter-spacing:-1px}
[data-cards=clear] .c .court{inset:calc(var(--w)*.62) calc(var(--w)*.08) calc(var(--w)*.08) calc(var(--w)*.42);border-width:1px}
[data-cards=clear] .c .court b{display:none}
[data-cards=clear] .c .big{font-size:calc(var(--w)*.5)}
[data-cards=clear] .c.s-K .big,[data-cards=clear] .c:has(.court) .big{display:none}
/* luxe: engraved classic with gold inner frame and serif indices */
[data-cards=luxe]{--pip:block;--ace:grid;--court:flex;--ixb:.28;--ixi:.19;--ixw:.25}
[data-cards=luxe] .c{background:linear-gradient(160deg,#fffdf6,#f4ead2);box-shadow:inset 0 0 0 calc(var(--w)*.035) #fffdf6,inset 0 0 0 calc(var(--w)*.05) #b8913e,0 3px 8px rgba(0,0,0,.35)}
[data-cards=luxe] .c .ix b,[data-cards=luxe] .c .ix2 b{font-family:'Playfair Display',Georgia,serif;font-weight:800}
[data-cards=luxe] .c .court{background:linear-gradient(180deg,rgba(184,145,62,.35),rgba(184,145,62,.08));border-color:#b8913e}
[data-cards=luxe] .c .ace{font-size:calc(var(--w)*.7);text-shadow:0 0 0 #b8913e,0 1px 0 rgba(184,145,62,.6)}
.c.jk{background:linear-gradient(165deg,#fffaf0,#f8e3a6)}
.c.jk .jkc{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.55);color:#b0262f}
.c.jk .ix b{font-size:calc(var(--w)*.2);letter-spacing:0}
.c.back{background:var(--backbg);border:2px solid #fff}
.c.back:after{content:"";position:absolute;inset:calc(var(--w)*.07);border:1.5px solid rgba(255,255,255,.55);border-radius:calc(var(--w)*.06)}
[data-back]{--backbg:repeating-linear-gradient(45deg,#1b2a5e 0 5px,#24377a 5px 10px)}
[data-back=red]{--backbg:repeating-linear-gradient(45deg,#8a1a24 0 5px,#a6232e 5px 10px)}
[data-back=green]{--backbg:repeating-linear-gradient(-45deg,#0f5a3b 0 6px,#146b47 6px 12px)}
[data-back=luxe]{--backbg:radial-gradient(circle at 50% 50%,#f0d58a 0 7%,transparent 8%) 0 0/12px 12px,radial-gradient(circle at 0 0,#f0d58a 0 6%,transparent 7%) 6px 6px/12px 12px,repeating-linear-gradient(45deg,#7d1420 0 3px,#931a27 3px 6px)}
[data-back=royal]{--backbg:radial-gradient(circle at 50% 50%,transparent 0 30%,rgba(226,191,104,.55) 31% 34%,transparent 35%) 0 0/16px 16px,repeating-linear-gradient(-45deg,#14245a 0 4px,#1b3074 4px 8px)}
[data-back=gold]{--backbg:radial-gradient(circle at 50% 50%,#e2bf68 0 18%,transparent 19%) 0 0/14px 14px,linear-gradient(#1a1a1a,#2c2c2c)}
.c.w{box-shadow:0 0 0 2px var(--red) inset}
.mini .c{--w:30px}
.mini .c .ix2,.mini .c .pips,.mini .c .court,.mini .c .ace,.mini .c .big,.mini .c .jkc{display:none!important}
.mini .c .ix{left:2px;top:2px;width:auto}
.mini .c .ix b{font-size:13px}.mini .c .ix i{font-size:11px}
/* ---------- table ---------- */
.game{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:radial-gradient(90% 60% at 50% 35%,color-mix(in srgb,var(--bg1) 85%,#fff 4%),var(--bg2))}
.top{display:flex;align-items:center;gap:6px;padding:6px 8px}
.score{flex:1;display:flex;justify-content:center;gap:5px;font-size:12px;flex-wrap:wrap}
.game .top .ic{width:38px;height:38px}
.sp{display:flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line2)}
.sp b{font:600 17px/1 Oswald,sans-serif}
.sp .dot{width:9px;height:9px;border-radius:50%}
.mid{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;min-height:0;padding:0 2px}
.board{min-height:0;overflow-y:auto;border-radius:48% / 16%;background:radial-gradient(70% 60% at 50% 40%,var(--felt1),var(--felt2));box-shadow:0 0 0 6px var(--rim2),0 0 0 9px var(--rim1),inset 0 0 40px rgba(0,0,0,.45),0 20px 40px rgba(0,0,0,.45);padding:24px 14px 14px;display:flex;flex-direction:column;gap:6px;margin:6px 2px;touch-action:pan-y}
.board::before{content:"";position:absolute}
.zone{display:flex;flex-direction:column;gap:4px}
.zl{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);padding:0 30px}
.zl b{color:#fff}
.melds{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center;min-height:46px;align-items:flex-start}

.partner{display:flex;justify-content:center;padding:2px 0 2px}

.bar{padding:4px 10px 0;display:flex;flex-direction:column;gap:6px}

.ladders .lad{justify-content:center}.ladders .lrow{min-width:150px;justify-content:center;overflow:visible;align-items:center;gap:6px}.ladders .lrow .c{--w:min(11vw,44px);margin:0}.ladders .lrow .c.lastp{box-shadow:0 0 0 3px var(--gold),0 0 14px var(--gold)}.lmid{font:700 13px Oswald,sans-serif;color:#fff;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:10px;padding:2px 8px}

.mtitle{flex:1;text-align:center;font-weight:900;font-size:18px}
.mbody{overflow-y:auto;padding:6px 12px;touch-action:pan-y}

.mp{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:18px;background:var(--panel);border:1px solid var(--line2);font-size:12.5px;text-align:center;transition:transform .12s}

.rtag.r-mafia{background:#7a1820;color:#ffd5d8}.rtag.r-doctor{background:#14583c}.rtag.r-detective{background:#1d4a7a}.rtag.r-notmafia{background:#14583c}
.vcnt{position:absolute;top:6px;left:6px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font:600 14px/24px Oswald,sans-serif;padding:0 6px}
.mk{position:absolute;top:4px;left:-4px;font-size:16px}
.voters{font-size:10px;color:var(--dim);line-height:1.2}
.mban{margin:8px 0;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--line);text-align:center;font-size:15px;line-height:1.6}
.mban.big{font-size:24px;font-weight:900;padding:16px}
.mpanel{position:relative;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(0,0,0,.5) 30%);text-align:center}

.mybadge{position:absolute;top:-34px;left:12px;min-height:32px;padding:2px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:800}
.rolecard{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(100%,320px);margin:0 auto;padding:22px 16px;border-radius:22px;background:linear-gradient(160deg,#1b2451,#0c1130);border:2px solid var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.5);font-size:14px;line-height:1.6}

/* coup */
.coupv{background:radial-gradient(70% 45% at 50% 0%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 65%),radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2) 80%)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0}
.cgrid.two{grid-template-columns:1fr 1fr;max-width:300px;margin:6px auto}
.ccard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 8px;border-radius:16px;color:#fff;border:2px solid rgba(255,255,255,.25);box-shadow:0 8px 20px rgba(0,0,0,.4);text-align:center;min-height:112px}
.ccard .ce{font-size:34px;line-height:1.1}.ccard b{font-size:15px}.ccard .cab{font-size:10.5px;opacity:.85;line-height:1.3}

.ccard.dead{filter:grayscale(1) brightness(.5)}.ccard .cx{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;color:#ff5a64;opacity:.8}
.c-duke{background:linear-gradient(160deg,#7b3fb8,#3d1a66)}.c-assassin{background:linear-gradient(160deg,#3a3a42,#0e0e12)}.c-captain{background:linear-gradient(160deg,#2c78c9,#123b6b)}
.c-ambassador{background:linear-gradient(160deg,#2f9a66,#14513a)}.c-contessa{background:linear-gradient(160deg,#d24a5a,#6e1521)}
.cp.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.cp .coins{font:600 14px Oswald,sans-serif;color:var(--gold)}
.minic{display:flex;gap:4px}.minic i{font-style:normal;width:24px;height:32px;border-radius:5px;display:grid;place-items:center;font-size:14px;border:1px solid rgba(255,255,255,.3)}
.minic i.hid{background:var(--backbg);color:rgba(255,255,255,.6);font-weight:900}.minic i.dead{filter:grayscale(1) brightness(.6)}
.think{position:absolute;top:4px;right:8px;font-weight:900;color:var(--gold);animation:pulse 1s infinite}
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.abtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;color:#fff}
.abtn span{font-size:22px}.abtn b{font-size:12.5px}.abtn small{font-size:10px;opacity:.8}.abtn:disabled{opacity:.3}
.rs{justify-content:center}
.clog{margin:6px auto 0;max-width:420px;font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
.mine{margin-top:8px}.mycoins{font-size:15px;text-align:center}.mycoins b{font:600 20px Oswald,sans-serif;color:var(--gold)}

.myfront{display:flex;justify-content:center;gap:8px;padding:2px 0 6px;direction:ltr}
.myfront button .c{--w:50px;box-shadow:0 0 0 2px var(--red),0 6px 14px rgba(0,0,0,.45)}
.myfront button.armed .c{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 10px 18px rgba(0,0,0,.5)}
/* score cross */
.scross{position:fixed;top:calc(54px + env(safe-area-inset-top));left:8px;z-index:6;width:92px;height:76px;display:grid;grid-template:1fr 1fr 1fr/1fr 1fr 1fr;place-items:center;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25)}

.scross .t{grid-area:1/2}.scross .l{grid-area:2/1}.scross .r{grid-area:2/3}.scross .m{grid-area:3/2;background:var(--gold);color:var(--btnink)}
.sclabel{position:fixed;top:calc(136px + env(safe-area-inset-top));left:8px;z-index:6;background:#0b0d14;color:#fff;border-radius:10px;padding:3px 10px;font-weight:800;font-size:13px}
/* double dialog */
.dmodal{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;width:min(86vw,340px);background:linear-gradient(180deg,#1a2030,#10141f);border:1px solid var(--line);border-radius:22px;padding:16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:fade .2s}

.dcards{display:flex;justify-content:center;gap:12px;margin:14px 0;direction:ltr}
.dcards button .c{--w:74px;transition:transform .15s}
.dcards button.dsel .c{transform:translateY(-10px);box-shadow:0 0 0 3px var(--red),0 0 18px rgba(216,52,63,.6)}
/* round summary */
.sumbox{max-width:460px;animation:pop2 .35s cubic-bezier(.2,.8,.3,1)}
@keyframes pop2{from{transform:scale(.85);opacity:0}}
.sumhead{display:flex;align-items:center;justify-content:center;gap:10px;font-size:30px;margin-bottom:8px}
.sumhead h2{margin:0;font-size:24px;background:linear-gradient(180deg,#fff6dc,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sumbox table{border-collapse:separate;border-spacing:0 4px}
.sumbox th{font-size:12.5px;padding:4px}.sumbox th .avt{margin-bottom:2px}
.sumbox td{background:rgba(255,255,255,.05);font:600 15px Oswald,Cairo,sans-serif;padding:8px 6px}
.sumbox td:first-child{font:700 13px Cairo,sans-serif;border-radius:0 10px 10px 0;color:var(--dim)}
.sumbox td:last-child{border-radius:10px 0 0 10px}
.sumbox tr:last-child td{background:color-mix(in srgb,var(--gold) 18%,transparent);color:#fff}
/* reactions and tutorial */
.reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.reacts button{min-height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);font-size:20px;font-weight:800}
.tut{text-align:center}.tut .ti{font-size:52px;line-height:1.2}.tut p{font-size:15.5px;line-height:1.8;margin:8px 0 14px}
.tut .dots{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}.tut .dots i{width:8px;height:8px;border-radius:50%;background:var(--line2)}.tut .dots i.on{background:var(--gold)}
/* replay */
.rpbar{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:85;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:18px;background:rgba(10,14,30,.94);border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6);white-space:nowrap}
.rpbar b{font:600 13px Oswald,sans-serif;color:var(--gold)}.rpbar .ic{width:36px;height:36px}
/* discard picker */
.dpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin:12px 0;direction:ltr}
.dp{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px;border-radius:12px;opacity:.45;transition:opacity .15s,transform .15s}
.dp .c{--w:52px}.dp.on{opacity:1}.dp.on .c{box-shadow:0 0 0 2px var(--gold)}.dp.first .c{box-shadow:0 0 0 3px var(--gold),0 0 14px var(--gold);transform:translateY(-4px)}
.dp .dn{font:600 11px Oswald,sans-serif;color:var(--dim)}
/* turn timer */
.tmr{position:absolute;top:-8px;left:-6px;z-index:3;min-width:28px;height:28px;border-radius:14px;padding:0 6px;display:grid;place-items:center;background:var(--gold);color:var(--btnink);font:600 15px Oswald,sans-serif;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.status .tmr{position:static;margin-inline-end:6px}
.tmr.low{background:var(--red);color:#fff;animation:pulse .6s infinite}
/* flights */
.flyer{position:fixed;left:0;top:0;z-index:80;pointer-events:none}.flyer .c{--w:46px;box-shadow:0 12px 24px rgba(0,0,0,.5)}
.flabel{position:fixed;z-index:81;transform:translateX(-50%);pointer-events:none;background:rgba(10,14,30,.92);border:1px solid var(--gold);color:#fff;font-weight:800;font-size:13px;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:flab 2.3s ease forwards}
@keyframes flab{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
/* animations */
@keyframes turn{0%,100%{box-shadow:0 0 0 3px var(--tc),0 0 0 0 transparent}50%{box-shadow:0 0 0 3px var(--tc),0 0 22px 6px var(--tc)}}
@keyframes pulse{50%{opacity:.7}}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes inB{from{transform:translateY(170px) scale(.8) rotate(-6deg);opacity:.2}}@keyframes inT{from{transform:translateY(-170px) scale(.8) rotate(6deg);opacity:.2}}
@keyframes inL{from{transform:translateX(-150px) scale(.8) rotate(-8deg);opacity:.2}}@keyframes inR{from{transform:translateX(150px) scale(.8) rotate(8deg);opacity:.2}}
.c.in-pb{animation:inB .6s cubic-bezier(.2,.8,.3,1)}.c.in-pt{animation:inT .6s cubic-bezier(.2,.8,.3,1)}.c.in-pl{animation:inL .6s cubic-bezier(.2,.8,.3,1)}.c.in-pr{animation:inR .6s cubic-bezier(.2,.8,.3,1)}
@keyframes toB{to{transform:translateY(180px) scale(.4) rotate(10deg);opacity:0}}@keyframes toT{to{transform:translateY(-180px) scale(.4) rotate(-10deg);opacity:0}}
@keyframes toL{to{transform:translateX(-160px) scale(.4);opacity:0}}@keyframes toR{to{transform:translateX(160px) scale(.4);opacity:0}}
.trickbox.collect .c{animation-duration:.7s;animation-timing-function:ease-in;animation-fill-mode:forwards;animation-delay:var(--cd)}
.trickbox.c-pb .c{animation-name:toB}.trickbox.c-pt .c{animation-name:toT}.trickbox.c-pl .c{animation-name:toL}.trickbox.c-pr .c{animation-name:toR}
@keyframes deal{from{transform:translateY(-240px) rotate(-10deg) scale(.7);opacity:0}}
.hand .c.deal{animation:deal .4s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes drop{from{transform:translateY(-90px) scale(1.15) rotate(-6deg);opacity:.3}}
.disc .c.drop{animation:drop .3s cubic-bezier(.2,.8,.3,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:520px){.mid{grid-template-columns:84px minmax(0,1fr) 84px}.mini .c{--w:34px}.seatv .avt{--s:48px}}
@media(orientation:landscape) and (max-height:560px){
  .game{grid-template-rows:auto minmax(0,1fr) auto auto}
  .partner{position:absolute;top:4px;left:110px;padding:0;z-index:4}.partner .avt{--s:34px}
  .top{padding:4px 8px}.mid{grid-template-columns:84px minmax(0,1fr) 84px}
  .board{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  .board .zone{flex:1 1 45%}.board .strip{order:-1;flex:1 1 100%}
  .bar{flex-direction:row;align-items:center;justify-content:center;padding:2px 10px}
  .mini .c{--w:28px}.trickbox{height:min(52vh,190px)}.slot .c{--w:46px}
}
.nbanner{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(94vw,440px);z-index:95;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#232b42,#1a2033);border:1px solid var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.55);color:var(--ink);text-align:start;animation:nslide .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes nslide{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}

<script>
const Mor = (() => {
  const SUITS = ['S', 'H', 'D', 'C'];
  const TARGET = 620;
  const MOR_MIN = 40, CLOSE_MIN = 100;

  const card = id => ({ id, s: id[0], r: id[0] === 'J' ? 0 : parseInt(id.slice(1), 10) });
  const isJ = id => id[0] === 'J';
  const rankOf = id => card(id).r;
  const teamOf = seat => seat % 2;

  function rnd(n) {
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function buildDeck() {
    const d = [];
    for (const k of ['a', 'b']) {
      for (const s of SUITS) for (let r = 1; r <= 13; r++) d.push(s + r + k);
      d.push('J0' + k);
    }
    return d;
  }

  // ---------- meld validation ----------
  function analyzeSeq(ids) {
    const N = ids.length;
    if (N < 3 || N > 13) return null;
    const jok = ids.filter(isJ);
    const twos = ids.filter(i => !isJ(i) && rankOf(i) === 2);
    const others = ids.filter(i => !isJ(i) && rankOf(i) !== 2);
    // house rule: at most one joker and one 2 in a meld (a 2 and a joker together are fine)
    if (jok.length > 1 || twos.length > 1) return null;
    let suits = [...new Set(others.map(i => i[0]))];
    if (suits.length > 1) return null;
    if (!suits.length) suits = [...new Set(twos.map(i => i[0]))];
    let best = null;
    for (const S of suits) {
      const natTwoOptions = [null, ...twos.filter(t => t[0] === S)];
      for (const nt of natTwoOptions) {
        const wildTwos = twos.filter(t => t !== nt);
        if (wildTwos.length > 1) continue;
        const nat = nt ? [...others, nt] : others.slice();
        const nonAce = nat.filter(i => rankOf(i) !== 1).map(rankOf);
        if (new Set(nonAce).size !== nonAce.length) continue;
        const aces = nat.filter(i => rankOf(i) === 1);
        if (aces.length > 1) continue;
        for (let s = 1; s + N - 1 <= 14; s++) {
          const e = s + N - 1;
          if (!nonAce.every(r => r >= s && r <= e)) continue;
          let acePos = null;
          if (aces.length) {
            if (s === 1) acePos = 1; else if (e === 14) acePos = 14; else continue;
          }
          const slots = new Array(N).fill(null);
          for (const i of nat) { const r = rankOf(i); const p = r === 1 ? acePos : r; slots[p - s] = i; }
          const wild = [...jok, ...wildTwos];
          let w = 0;
          for (let k = 0; k < N; k++) if (!slots[k]) slots[k] = wild[w++];
          // a 2 of the run's own suit does not break it; a joker or a 2 of another suit does
          const clean = jok.length === 0 && wildTwos.every(t => t[0] === S);
          const res = { type: 'seq', ok: true, clean, suit: S, start: s, order: slots, wild };
          if (!best || (clean && !best.clean)) best = res;
          if (best.clean) return best;
        }
      }
    }
    return best;
  }

  function analyzeSet(ids) {
    const N = ids.length;
    if (N < 3) return null;
    const jok = ids.filter(isJ);
    const nat = ids.filter(i => !isJ(i));
    if (jok.length > 1 || !nat.length) return null;
    const r = rankOf(nat[0]);
    if (r === 2) return null;
    if (!nat.every(i => rankOf(i) === r)) return null;
    const order = [...nat.sort((a, b) => SUITS.indexOf(a[0]) - SUITS.indexOf(b[0])), ...jok];
    return { type: 'set', ok: true, clean: jok.length === 0, rank: r, order, wild: jok };
  }

  function analyze(ids) { return analyzeSeq(ids) || analyzeSet(ids); }

  function meldValue(m) {
    const a = analyze(m.cards); if (!a) return 0;
    const L = m.cards.length;
    let t = null;
    if (a.type === 'seq') {
      if (L >= 13) t = [100, 80]; else if (L >= 12) t = [80, 60]; else if (L >= 10) t = [60, 40]; else if (L >= 7) t = [40, 20];
    } else {
      if (L >= 8) t = [80, 60]; else if (L >= 7) t = [40, 20];
    }
    return t ? (a.clean ? t[0] : t[1]) : 0;
  }
  const ground = (st, team) => st.melds.filter(m => m.team === team).reduce((s, m) => s + meldValue(m), 0);

  // ---------- state ----------
  function newGame(names, bots) {
    return { v: 0, bots: bots || [false, false, false, false], phase: 'play', names, scores: [0, 0], round: 0, starter: 0, history: [], log: [], ...dealRound(0) };
  }
  function dealRound(starter) {
    const d = shuffle(buildDeck());
    const mor = [d.splice(0, 11), d.splice(0, 11)];
    const hands = [0, 1, 2, 3].map(() => d.splice(0, 14));
    const discard = d.splice(0, 1);
    return { stock: d, discard, mor, morBy: [null, null], hands, melds: [], pending: {}, turn: starter, step: 'draw', mid: 1, summary: null, finalTurn: false,
      declared: null, melded: false, noDiscard: null, got: null, pen: [0, 0], penNotes: [], taken: [] };
  }
  const clone = st => JSON.parse(JSON.stringify(st));
  function err(msg) { const e = new Error(msg); e.game = true; throw e; }
  function need(st, seat, step) {
    if (st.phase !== 'play') err('انتهت الجولة');
    if (st.turn !== seat) err('ليس دورك');
    if (step && st.step !== step) err(step === 'draw' ? 'يجب أن تسحب أولاً' : 'سحبتَ بالفعل، نزّل أو ارمِ');
  }
  function takeFromHand(st, seat, ids) {
    const h = st.hands[seat];
    for (const id of ids) { const i = h.indexOf(id); if (i < 0) err('الورقة ليست معك'); h.splice(i, 1); }
  }
  const morLeft = st => st.mor.findIndex(p => p);
  const canMor = (st, seat) => morLeft(st) >= 0 && ground(st, teamOf(seat)) >= MOR_MIN;
  const canClose = (st, seat) => ground(st, teamOf(seat)) >= CLOSE_MIN;
  function log(st, s) { st.log.push(s); if (st.log.length > 30) st.log.shift(); }
  const nm = (st, seat) => st.names[seat];

  const decl = (st, seat, kind) => st.declared && st.declared.seat === seat && st.declared.kind === kind;
  const okMor = (st, seat) => decl(st, seat, 'mor') && canMor(st, seat);
  const okClose = (st, seat) => decl(st, seat, 'close') && canClose(st, seat);
  function emptyErr(st, seat) {
    if (!st.declared || st.declared.seat !== seat) return 'يجب أن تعلن قبل التنزيل: «أريد المور» أو «أريد الضمان»';
    return st.declared.kind === 'mor' ? 'يلزم 40 على الأرض لتأخذ المور' : 'يلزم 100 على الأرض لتضمن';
  }
  function afterEmpty(st, seat) {
    const h = st.hands[seat];
    if (h.length > 1) return;
    if (!okMor(st, seat) && !okClose(st, seat)) err((h.length ? 'يجب أن تبقى معك ورقتان لترمي إحداهما: ' : 'لا يمكنك إنهاء أوراقك: ') + emptyErr(st, seat));
    if (h.length === 1 && st.noDiscard && st.noDiscard.seat === seat && st.noDiscard.id === h[0]) err('ستبقى آخر ورقة هي التي أخذتها من الأرض، ولا يمكنك إعادتها');
  }
  function declare(s, seat, kind) {
    const st = clone(s); need(st, seat, 'play');
    if (kind !== 'mor' && kind !== 'close') err('إعلان خاطئ');
    if (st.melded) err('يجب أن يكون الإعلان قبل تنزيل أوراق في هذا الدور');
    if (kind === 'mor' && morLeft(st) < 0) err('لم يبقَ مور');
    st.declared = { seat, kind };
    log(st, nm(st, seat) + (kind === 'mor' ? ' أعلن أنه يريد أخذ المور' : ' أعلن أنه يريد الضمان'));
    return st;
  }
  function undeclare(s, seat) {
    const st = clone(s); need(st, seat, 'play');
    if (st.melded) err('لا يمكنك إلغاء الإعلان بعد التنزيل');
    st.declared = null; return st;
  }

  function draw(s, seat) {
    const st = clone(s); need(st, seat, 'draw');
    if (!st.stock.length) err('انتهت السحبة، خذ من الأرض');
    const c = st.stock.pop(); st.hands[seat].push(c); st.step = 'play'; st.got = { seat, ids: [c] }; st.noDiscard = null; st.sinceDraw = 0;
    log(st, nm(st, seat) + ' سحب من السحبة');
    return st;
  }
  function takeDiscard(s, seat, index) {
    const st = clone(s); need(st, seat, 'draw');
    if (index < 0 || index >= st.discard.length) err('ورقة خاطئة');
    const got = st.discard.splice(index); st.sinceDraw = (st.sinceDraw || 0) + 1;
    st.hands[seat].push(...got); st.step = 'play'; st.got = { seat, ids: got };
    st.noDiscard = got.length === 1 ? { seat, id: got[0] } : null;
    (st.taken = st.taken || []).push({ seat, ids: got.slice(0, 6) }); if (st.taken.length > 24) st.taken.shift();
    log(st, nm(st, seat) + ' أخذ ' + got.length + ' من الأرض');
    return st;
  }
  function meldNew(s, seat, ids) {
    const st = clone(s); need(st, seat, 'play');
    if (ids.length < 3) err('التنزيلة يجب أن تكون 3 أوراق أو أكثر');
    const a = analyze(ids); if (!a) err('هذه الأوراق لا تشكّل سيري ولا مجموعة متشابهة');
    takeFromHand(st, seat, ids);
    st.melds.push({ id: 'm' + (st.mid++), team: teamOf(seat), cards: a.order }); st.melded = true;
    afterEmpty(st, seat);
    log(st, nm(st, seat) + ' نزّل ' + ids.length + ' أوراق');
    return st;
  }
  function addToMeld(s, seat, meldId, ids) {
    const st = clone(s); need(st, seat, 'play');
    const m = st.melds.find(x => x.id === meldId); if (!m) err('التنزيلة غير موجودة');
    if (m.team !== teamOf(seat)) err('لا يمكنك الإضافة إلى تنزيلات الخصم');
    const a = analyze([...m.cards, ...ids]); if (!a) err('لا تصلح لهذه التنزيلة');
    takeFromHand(st, seat, ids); m.cards = a.order; st.melded = true;
    afterEmpty(st, seat);
    log(st, nm(st, seat) + ' زاد ' + ids.length + ' على تنزيلة');
    return st;
  }
  function swapOptions(m, id) {
    const out = [];
    for (const w of m.cards) {
      if (out.some(o => o.w === w)) continue;
      const wIsJ = isJ(w), wIsTwo = !wIsJ && rankOf(w) === 2;
      if (!wIsJ && !wIsTwo) continue;
      const cur = analyze(m.cards); if (!cur || !cur.wild.includes(w)) continue;
      if (wIsTwo && (cur.type !== 'seq' || m.cards.length !== 13)) continue;
      if (isJ(id)) continue;
      const rest = m.cards.slice(); rest.splice(rest.indexOf(w), 1);
      const a = analyze([...rest, id]);
      if (a && !a.wild.includes(id) && a.type === cur.type) out.push({ w, order: a.order });
    }
    return out;
  }
  function swapWild(s, seat, meldId, id) {
    const st = clone(s); need(st, seat, 'play');
    const m = st.melds.find(x => x.id === meldId); if (!m) err('التنزيلة غير موجودة');
    if (m.team !== teamOf(seat)) err('لا يمكنك التبديل في تنزيلات الخصم');
    const opts = swapOptions(m, id);
    if (!opts.length) err('هذه الورقة لا تصلح مكان الجوكر أو الـ2 هنا');
    const o = opts.find(x => isJ(x.w)) || opts[0];
    takeFromHand(st, seat, [id]); st.hands[seat].push(o.w); m.cards = o.order; st.melded = true;
    log(st, nm(st, seat) + (isJ(o.w) ? ' تحرير جوكر' : ' بدّل 2'));
    return st;
  }
  function takeMorNow(s, seat) {
    const st = clone(s); need(st, seat, 'play');
    if (st.hands[seat].length) err('يجب أن تنهي أوراقك أولاً');
    if (!okMor(st, seat)) err('لا يمكنك أخذ المور: ' + emptyErr(st, seat));
    const k = morLeft(st); st.hands[seat] = st.mor[k]; st.mor[k] = null; st.morBy[k] = teamOf(seat);
    st.got = { seat, ids: st.hands[seat].slice() }; st.declared = null; st.melded = false;
    log(st, nm(st, seat) + ' أخذ المور (مستمر)');
    return st;
  }
  function discard(s, seat, id) {
    const st = clone(s); need(st, seat, 'play');
    if (st.noDiscard && st.noDiscard.seat === seat && st.noDiscard.id === id) {
      const twin = st.hands[seat].find(x => x !== id && x.slice(0, -1) === id.slice(0, -1));
      if (!twin) err('لا يمكنك إعادة الورقة التي أخذتها وحدها من الأرض');
      id = twin;
    }
    takeFromHand(st, seat, [id]); st.discard.push(id);
    if (!st.hands[seat].length) {
      if (!okMor(st, seat) && !okClose(st, seat)) err('لا يمكنك رمي آخر ورقة: ' + emptyErr(st, seat));
      st.step = 'choice'; log(st, nm(st, seat) + ' رمى آخر ورقة');
      return st;
    }
    log(st, nm(st, seat) + ' رمى ورقة');
    if (st.declared && st.declared.seat === seat) {
      st.pen[teamOf(seat)] += 20; st.mistakes = st.mistakes || [0, 0, 0, 0]; st.mistakes[seat]++; st.penNotes.push(nm(st, seat) + ' أعلن ' + (st.declared.kind === 'mor' ? 'المور' : 'الضمان') + ' ولم يستطع: −20');
      log(st, nm(st, seat) + ' انكسر: −20');
    }
    return nextTurn(st);
  }
  function chooseMor(s, seat) {
    const st = clone(s); need(st, seat, 'choice');
    if (!okMor(st, seat)) err('لا يمكنك أخذ المور');
    const k = morLeft(st); st.hands[seat] = st.mor[k]; st.pending[seat] = true; st.mor[k] = null; st.morBy[k] = teamOf(seat);
    log(st, nm(st, seat) + ' أخذ المور (منقطع)');
    return nextTurn(st);
  }
  function close(s, seat) {
    const st = clone(s);
    if (st.phase !== 'play' || st.turn !== seat) err('ليس دورك');
    if (st.hands[seat].length) err('يجب أن تنهي أوراقك لتضمن');
    if (!okClose(st, seat)) err('لا يمكنك الضمان: ' + emptyErr(st, seat));
    log(st, nm(st, seat) + ' اضمن');
    return endRound(st, 'close', seat);
  }
  function nextTurn(st) {
    if (!st.stock.length) {
      if (st.finalTurn) return endRound(st, 'stock', null);
      st.finalTurn = true;
    }
    st.turn = (st.turn + 1) % 4; st.step = 'draw';
    st.declared = null; st.melded = false; st.noDiscard = null;
    delete st.pending[st.turn];

        swapCard(st, bp, b.as);
        st.queue = [{ k: 'lose', p: id, why: 'شكّ خاطئ' }, { k: 'next' }];

function seatWon(st, s) {
  const G = gameOf(st);

let recording = null;
async function recordMatch(st) {
  if (recording === st.deal) return; recording = st.deal;
  const G = gameOf(st), seats = st.seats || [];
  const humans = [0, 1, 2, 3].filter(s => seats[s]);
  if (humans.length < 2) return;
  try {
    const roomRef = fbB.ref('rooms', ui.code);
    const ok = await FB.runTransaction(fb.db, async tx => { const r = await tx.get(roomRef); if ((r.data() || {}).recorded === st.deal) return false; tx.update(roomRef, { recorded: st.deal }); return true; });
    if (!ok) return;
    const mist = st.mistakes || [0, 0, 0, 0];
    await FB.addDoc(fbB.col('matches'), {
      game: G.id, t: Date.now(), uids: humans.map(s => seats[s]),
      players: [0, 1, 2, 3].map(s => ({ uid: seats[s] || null, name: st.names[s], seat: s, won: seatWon(st, s), bot: !seats[s], mistakes: mist[s] || 0 })),
      scores: st.tscores || st.scores

    for (const s of humans) {
      const ref = fbB.ref('users', seats[s]);
      await FB.runTransaction(fb.db, async tx => {
        const d = (await tx.get(ref)).data() || {};
        const all = d.stats || {}, me = all[G.id] || { rating: START, played: 0, wins: 0, losses: 0, mistakes: 0 };
        const won = seatWon(st, s), m = mist[s] || 0;
        me.rating = Math.max(0, me.rating + (won ? 25 : -20) - 3 * m);
        me.played++; won ? me.wins++ : me.losses++; me.mistakes += m;
        all[G.id] = me;
        tx.set(ref, { t: Date.now(), stats: all }, { merge: true });
      });
    }
    toast('حُفظت النتيجة في الترتيب');
  } catch (e) { console.error(e); recording = null; }
}

async function showStats() {

async function loginWith(idv, pw) {
  let ems = [idv];
  if (!idv.includes('@')) {
    const q = await FB.getDocs(FB.query(fbB.col('users'), FB.where('nameKey', '==', nameKey(idv)), FB.limit(1)));
    if (q.empty) { const e = new Error('nouser'); e.code = 'auth/user-not-found'; throw e; }
    const d = q.docs[0].data(); ems = [d.email, d.alt].filter(Boolean);
    if (!ems.length) { const e = new Error('noemail'); e.code = 'sahra/no-account'; throw e; }
  }
  let err; for (const em of ems) { try { await FB.signInWithEmailAndPassword(fb.auth, em, pw); return; } catch (e) { err = e; } }
  throw err;
}

// ---------- hand layout & drag ----------
function layoutHand() {
  const el = document.getElementById('hand'); if (!el) return;
  const cards = [...el.children]; const n = cards.length; if (!n) { el.style.height = '0'; return; }
  const land = matchMedia('(orientation:landscape) and (max-height:560px)').matches;
  const W = el.parentElement.clientWidth - 16;
  let w = land ? 46 : Math.min(64, Math.max(48, W / 7.2));
  const rows = prof.handRows === 2 && !land && n > 7 ? 2 : prof.handRows === 1 ? 1 : (!land && n > 16) ? 2 : 1;
  const perRow = Math.ceil(n / rows);
  let step = Math.min(w * 0.62, (W - w) / Math.max(1, perRow - 1));
  const h = w * 1.42, rowGap = h * 0.55;
  el.style.width = W + 'px'; el.style.height = (h + (rows - 1) * rowGap + 18) + 'px';
  const pos = [];
  cards.forEach((c, i) => {
    const r = Math.floor(i / perRow), k = i % perRow, cnt = Math.min(perRow, n - r * perRow);
    const total = w + step * (cnt - 1), x0 = (W - total) / 2;
    const x = x0 + k * step, y = 16 + r * rowGap;
    c.style.setProperty('--w', w + 'px'); c.style.left = x + 'px'; c.style.top = y + 'px'; c.style.zIndex = i + 1;
    pos.push({ x, y, id: c.dataset.id });
  });
  el._pos = pos; el._w = w; el._step = step;
}
let drag = null;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('#hand .c'); if (!c || drag || ui.hidden || e.button !== 0) return;
  const el = document.getElementById('hand');
  drag = { pointerId: e.pointerId, id: c.dataset.id, el: c, sx: e.clientX, sy: e.clientY, moved: false, ox: parseFloat(c.style.left), oy: parseFloat(c.style.top), hand: el };
  c.setPointerCapture && c.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!drag || drag.pointerId !== e.pointerId || !drag.el.isConnected) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true; drag.el.classList.add('drag');
  drag.el.style.left = drag.ox + dx + 'px';
  drag.el.style.top = drag.oy + dy + 'px';
});
document.addEventListener('pointerup', e => {
  if (!drag || drag.pointerId !== e.pointerId) return;
  const d = drag; drag = null;
  if (!d.el.isConnected || !ui.st || ui.hidden) return;
  const tg = ui.st && gameOf(ui.st).id !== 'mor';
  if (tg) {
    if (d.moved) { if (d.sy - e.clientY > 70) return tryPlay(d.id); return render(); }
    return tapCard(d.id);
  }
  if (!d.moved) { const id = d.id; ui.sel.has(id) ? ui.sel.delete(id) : ui.sel.add(id); return render(); }
  // drop a dragged card (with any other selected cards) onto a meld, the board or the discard pile
  const st = ui.st, me = mySeat(), target = document.elementFromPoint(e.clientX, e.clientY);
  if (target && st.turn === me && st.step === 'play' && st.phase === 'play') {
    const ids = ui.sel.has(d.id) ? [...ui.sel] : [d.id];
    const mEl = target.closest('[data-meld]');
    if (mEl) {
      const m = st.melds.find(x => x.id === mEl.dataset.meld);
      if (m && m.team === Mor.teamOf(me)) {
        ui.sel.clear();
        if (Mor.analyze([...m.cards, ...ids])) return act(Mor.addToMeld, m.id, ids);
        if (ids.length === 1 && Mor.swapOptions(m, ids[0]).length) return act(Mor.swapWild, m.id, ids[0]);
        toast('هذه الورقة لا تصلح لهذه التنزيلة'); return render();
      }
    }
    if (target.closest('#disc') && ids.length === 1) { ui.sel.clear(); return act(Mor.discard, ids[0]); }
    if (target.closest('.board') && ids.length >= 3) { ui.sel.clear(); return act(Mor.meldNew, ids); }
  }
  const order = ui.order[me]; if (!order) return render();
  const x = parseFloat(d.el.style.left) + d.hand._w / 2, y = parseFloat(d.el.style.top);
  let best = 0, bd = Infinity;
  d.hand._pos.forEach((p, i) => { const dd = Math.abs(p.x + d.hand._w / 2 - x) + Math.abs(p.y - y) * 2; if (dd < bd) { bd = dd; best = i; } });
  const from = order.indexOf(d.id); order.splice(from, 1); order.splice(best, 0, d.id);
  render();
});

function tryPlay(id) {

  if (st.phase === 'play') return act(G.play, id);

}
function tapCard(id) {

  if (prof.prePlay !== false && me >= 0 && G.actor(st) !== me && (st.phase === 'play' || st.phase === 'trix')) { ui.prePlay = ui.prePlay === id ? null : id; SFX.tap(); return render(); }

  if (ui.armed === id) return tryPlay(id);

}
function prePlayCheck(st) {
  const id = ui.prePlay; if (!id || !st || st.game === 'mor' || !st.hands) return;
  const G = gameOf(st), me = mySeat();
  if (!st.hands[me] || !st.hands[me].includes(id) || st.phase === 'handEnd' || st.phase === 'over') { ui.prePlay = null; return; }

  ui.prePlay = null;
  if (legal.includes(id)) setTimeout(() => { if (ui.st && gameOf(ui.st).actor(ui.st) === me && !ui.busy) tryPlay(id); }, 450);
  else toast('الورقة التي جهّزتها لا تصلح الآن، اختر ورقة أخرى');
}

// ---------- card flights: show who drew, took, discarded or melded ----------
function seatEl(s) { return document.querySelector(`[data-seat="${s}"]`) || (s === mySeat() ? document.getElementById('hand') : null); }
function centerOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function fly(fromEl, toEl, ids, opts = {}) {
  if (!fromEl || !toEl || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const a = centerOf(fromEl), b = centerOf(toEl), dur = opts.dur || 750, n = Math.min(ids.length, 5);
  for (let i = 0; i < n; i++) {
    const w = document.createElement('div');
    w.className = 'flyer';
    w.innerHTML = cardHTML(ids[i]);
    document.body.appendChild(w);
    const off = (i - (n - 1) / 2) * 14;
    const anim = w.animate([
      { transform: `translate(${a.x + off - 23}px,${a.y - 32}px) scale(${opts.s0 || 1}) rotate(${-6 + i * 3}deg)`, opacity: 0.2 },
      { offset: 0.2, opacity: 1 },
      { transform: `translate(${(a.x + b.x) / 2 + off - 23}px,${Math.min(a.y, b.y) - 50}px) scale(1.15) rotate(${4 - i * 2}deg)`, opacity: 1 },
      { transform: `translate(${b.x + off - 23}px,${b.y - 32}px) scale(${opts.s1 || 0.8}) rotate(0deg)`, opacity: opts.keep ? 1 : 0.15 }
    ], { duration: dur, delay: i * 90, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'backwards' });
    anim.onfinish = () => w.remove(); setTimeout(() => w.remove(), dur + i * 90 + 200);
  }

}
function floatLabel(el, text) {
  const c = centerOf(el), d = document.createElement('div');
  d.className = 'flabel'; d.textContent = text;
  d.style.left = c.x + 'px'; d.style.top = Math.max(60, c.y - 54) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 2300);
}
function flyFor(prev, st) {
  if (!prev || !st || prev === st || st.game !== prev.game || st.deal !== prev.deal) return;
  if ((st.game || 'mor') !== 'mor' || st.phase !== 'play' && st.phase !== 'roundEnd') return;
  const me = mySeat(), nm = s => st.names[s];
  // drew from the stock
  if (st.stock.length < prev.stock.length && st.got && st.got.ids.length === 1) {
    const s = st.got.seat;
    fly(document.querySelector('.piles .pile'), seatEl(s), [s === me ? st.got.ids[0] : 'back'], { label: s === me ? '' : nm(s) + ' سحب من السحبة' });
    return;
  }
  // took from the discard pile
  if (st.discard.length < prev.discard.length && st.got) {
    const s = st.got.seat, ids = st.got.ids;
    fly(document.getElementById('disc'), seatEl(s), ids, { dur: 950, label: (s === me ? 'أخذت ' : nm(s) + ' أخذ ') + (ids.length === 1 ? 'ورقة من الأرض' : ids.length + ' أوراق من الأرض') });
    return;
  }
  // new melds or additions
  const cnt = q => q.melds.reduce((n, m) => n + m.cards.length, 0);
  if (cnt(st) > cnt(prev)) {
    const before = new Set(prev.melds.flatMap(m => m.cards)), added = st.melds.flatMap(m => m.cards).filter(c => !before.has(c));
    const s = prev.turn;
    fly(seatEl(s), document.querySelector('.board'), added, { dur: 900, label: s === me ? '' : nm(s) + ' نزّل ' + added.length });
  }
  // discarded a card
  if (st.discard.length === prev.discard.length + 1) {

    if (s !== me) fly(seatEl(s), document.getElementById('disc'), [last], { dur: 800, s1: 0.75 });
  }
}

  if (!/[\p{L}\p{N}]{2}/u.test(n.replace(/\s/g, ''))) return 'الاسم يجب أن يحتوي على حرفين أو رقمين على الأقل';
