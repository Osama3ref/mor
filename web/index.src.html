<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سهرة ورق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a lively majlis card night, polished like a real card app
   IDEA: an oval felt table seen from your chair, friends around it
   PICTURE: the table itself: seats, melds, discard row and your fanned hand
   COLOUR and TYPE: deep felt green, ivory cards, card red, team gold and team sky; Cairo + Oswald ranks
   LAYOUT: thin top bar, seats around an oval board, actions then hand pinned at the bottom; landscape spreads sideways */
:root{color-scheme:dark;--felt:#11613f;--felt2:#0a3f29;--felt3:#062a1b;--rim:#2f8a5f;--ink:#f4f1e6;--dim:#a9c7b6;--card:#fffdf6;--card2:#f1ead6;--cink:#16181b;--red:#d22e3b;--a:#f2c14e;--b:#56c2ec;--line:rgba(255,255,255,.13);--glass:rgba(4,24,15,.55)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(130% 90% at 50% 40%,var(--felt) 0%,var(--felt2) 55%,var(--felt3) 100%);color:var(--ink);font:15px/1.45 Cairo,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:5px 5px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);width:100%;user-select:text}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;background:linear-gradient(#ffd56e,#e9ad2b);color:#2a1d00;font-weight:800;box-shadow:0 3px 0 #a8770f,0 6px 14px rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a8770f}
.btn.alt{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:linear-gradient(#ef4a55,#c21f2c);color:#fff;box-shadow:0 3px 0 #82121c}
.btn.sky{background:linear-gradient(#7fd6f5,#3aa9d6);color:#03212d;box-shadow:0 3px 0 #1d6f90}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.35;pointer-events:none}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.muted{color:var(--dim);font-size:13px}
/* ---------- menu ---------- */
.menu{height:100%;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) max(4vw,14px) 40px}
.menu .in{max-width:720px;margin:0 auto}
.logo{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.logo h1{font-size:52px;line-height:1;margin:0;font-weight:800;letter-spacing:-1px}
.fanlogo{position:relative;width:86px;height:70px;flex:none}
.fanlogo .c{position:absolute;bottom:0;transform-origin:50% 120%}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;backdrop-filter:blur(4px)}
.panel h2{margin:0 0 4px;font-size:19px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.modes .panel{margin:0}
.seats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.seatin{display:flex;gap:6px;align-items:center}
.chip{min-height:36px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip.on{background:var(--b);color:#03212d}
.seat{min-height:68px;border-radius:16px;border:2px dashed var(--line);background:rgba(0,0,0,.2);padding:8px;text-align:center}
.seat.me{border-style:solid;border-color:var(--a)}
.code{font:600 42px/1.1 Oswald,sans-serif;letter-spacing:4px;direction:ltr}
details summary{cursor:pointer;font-weight:800}
/* ---------- cards ---------- */
.c{--w:52px;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.12);background:linear-gradient(160deg,var(--card),var(--card2));color:var(--cink);position:relative;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.18);overflow:hidden;text-align:left;direction:ltr}
.c .rk{position:absolute;left:calc(var(--w)*.08);top:calc(var(--w)*.04);font:600 calc(var(--w)*.4)/1 Oswald,'Arial Narrow',sans-serif;letter-spacing:-.5px}
.c .su{position:absolute;left:calc(var(--w)*.09);top:calc(var(--w)*.46);font-size:calc(var(--w)*.3);line-height:1}
.c .big{position:absolute;right:calc(var(--w)*.06);bottom:calc(var(--w)*.02);font-size:calc(var(--w)*.62);line-height:1;opacity:.92}
.c.r{color:var(--red)}
.c.jk{background:linear-gradient(160deg,#fff7d6,#f7d774)}
.c.jk .rk{font-size:calc(var(--w)*.3);top:calc(var(--w)*.08)}
.c.jk .big{color:#b0262f}
.c.back{background:repeating-linear-gradient(45deg,#8e1b24 0 6px,#a8232d 6px 12px);border:2px solid #fff4}
.c.back:after{content:"";position:absolute;inset:4px;border:1.5px solid rgba(255,255,255,.55);border-radius:5px}
.c.w{box-shadow:0 0 0 2px var(--red) inset}
.mini .c{--w:30px}.mini .c .su{display:none}.mini .c .big{font-size:15px;right:2px;bottom:1px}
.mini .c .rk{font-size:13px}
/* ---------- table ---------- */
.game{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:6px;padding:6px 8px}
.ic{width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.28);display:grid;place-items:center;font-weight:800;position:relative;flex:none}
.ic svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.score{flex:1;display:flex;justify-content:center;gap:6px;font-size:13px}
.sp{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.3)}
.sp b{font:600 17px/1 Oswald,sans-serif}
.sp .dot{width:9px;height:9px;border-radius:50%}
.mid{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;min-height:0;padding:0 2px}
.board{min-height:0;overflow-y:auto;border-radius:36px;background:radial-gradient(100% 100% at 50% 50%,rgba(255,255,255,.05),rgba(0,0,0,.18));box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),inset 0 10px 40px rgba(0,0,0,.35);padding:8px;display:flex;flex-direction:column;gap:6px}
.zone{display:flex;flex-direction:column;gap:4px}
.zl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:0 6px}
.zl b{color:var(--ink)}
.melds{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center;min-height:50px;align-items:flex-start}
.meld{position:relative;padding:5px 6px 4px 16px;border-radius:10px;background:rgba(0,0,0,.18);display:flex;direction:ltr}
.meld .c{margin-right:-15px}.meld .c:last-child{margin-right:0}
.meld.tap{box-shadow:0 0 0 2px var(--a);animation:pulse 1.4s infinite}
.meld .val{position:absolute;top:-7px;right:-5px;background:var(--a);color:#2a1d00;border-radius:8px;padding:0 6px;font:600 12px/16px Oswald,sans-serif}
.meld .val.z{background:#d9d4c6}
.meld.them .val{background:var(--b);color:#03212d}
.empty{font-size:12px;color:var(--dim);align-self:center}
.strip{display:flex;align-items:center;gap:8px;padding:4px 2px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.piles{display:flex;gap:6px;align-items:flex-end;flex:none}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dim);gap:2px}
.pile .c{--w:30px}
.pile.gone{opacity:.25}
.pile .n{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#fff;font:600 13px Oswald,sans-serif;text-shadow:0 1px 2px #000}
.pile.can .c{box-shadow:0 0 0 2px var(--a),0 0 14px var(--a)}
.disc{display:flex;direction:ltr;overflow-x:auto;padding:6px 4px 4px;flex:1;scrollbar-width:none}
.disc .c{--w:34px;margin-right:-18px}.disc .c:last-child{margin-right:0;box-shadow:0 0 0 2px #fff8}
.disc.can .c{cursor:pointer}.disc.can .c:last-child{box-shadow:0 0 0 2px var(--a),0 0 12px var(--a)}
.seatv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;font-size:12px;text-align:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;background:linear-gradient(#1e3a2d,#0e2219);box-shadow:0 0 0 3px var(--tc),0 4px 10px rgba(0,0,0,.4);position:relative}
.seatv.on .av{animation:turn 1.2s infinite}
.seatv .nm{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.cnt{position:absolute;bottom:-6px;right:-8px;background:#fff;color:#111;border-radius:9px;font:600 11px/17px Oswald,sans-serif;padding:0 5px;box-shadow:0 1px 3px #0006}
.tag{font-size:10px;padding:0 6px;border-radius:8px;background:rgba(0,0,0,.4)}
.bubble{position:absolute;top:-6px;z-index:5;background:#fff;color:#111;padding:4px 9px;border-radius:12px;font-size:12px;max-width:150px;white-space:normal;box-shadow:0 4px 12px #0007;animation:pop .2s}
.partner{display:flex;justify-content:center;padding:2px 0 6px}
.partner .seatv{flex-direction:row;gap:8px}
.bar{padding:4px 10px 0;display:flex;flex-direction:column;gap:6px}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;min-height:22px;text-align:center}
.status .last{font-weight:400;color:var(--dim);font-size:12px}
.acts2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.handwrap{position:relative;padding:0 8px max(10px,env(safe-area-inset-bottom))}
.hand{position:relative;margin:0 auto;touch-action:none}
.hand .c{position:absolute;transition:left .18s,top .18s,transform .12s;touch-action:none;cursor:grab}
.hand .c.sel{transform:translateY(-16px);box-shadow:0 0 0 3px var(--a),0 8px 16px rgba(0,0,0,.45)}
.hand .c.fresh:before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--b);z-index:1}
.hand .c.drag{transition:none;z-index:50;transform:translateY(-22px) scale(1.08);box-shadow:0 12px 24px rgba(0,0,0,.5)}
.hand .c.lock{filter:brightness(.8)}
.sortb{position:absolute;top:-30px;left:10px}
.banner{margin:0 8px;padding:4px 10px;border-radius:10px;background:rgba(242,193,78,.15);box-shadow:inset 0 0 0 1px var(--a);font-size:12px;text-align:center}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;animation:fade .15s}
.box{background:linear-gradient(#173a29,#0f2a1d);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:92vh;overflow:auto}
.box h2{margin:0 0 8px;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:start}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:9px 16px;border-radius:12px;z-index:90;font-weight:700;max-width:92vw;box-shadow:0 6px 18px #0007;text-align:center}
.chat{position:fixed;inset:auto 0 0 0;z-index:70;max-height:70vh;display:flex;flex-direction:column;background:linear-gradient(#183c2b,#0d2419);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #0008;padding:10px 12px max(10px,env(safe-area-inset-bottom));animation:up .2s}
.chat .msgs{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 0;min-height:120px;user-select:text}
.msg{max-width:80%;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.1);align-self:flex-start;font-size:14px}
.msg.me{align-self:flex-end;background:var(--a);color:#2a1d00}
.msg small{display:block;font-size:11px;opacity:.7}
.mic{width:48px;height:48px;border-radius:50%;background:var(--b);color:#03212d;display:grid;place-items:center;flex:none;touch-action:none}
.ic.von{background:var(--b);color:#03212d}.ic.vmute{background:var(--red);color:#fff}
.mic.rec{background:var(--red);color:#fff;animation:pulse 1s infinite}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.gcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);text-align:start;min-height:84px}
.gcard:active{transform:scale(.98)}
.gcard .gt{display:flex;flex-direction:column;gap:2px}.gcard b{font-size:18px}
.rules p{margin:6px 0 10px;line-height:1.7;color:#e6efe9;font-size:14.5px;user-select:text}
.sinfo{font-size:11px;color:var(--dim)}
.seatv .tag{display:inline-block;margin:1px}.seatv>div:last-child{max-width:84px}
.tboard{align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ichip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.3);font-size:12.5px}
.ichip b{font-size:14px}.red{color:#ff6b74}
.mini.inl{display:inline-flex;direction:ltr}.mini.inl .c{--w:22px;margin-right:-8px}.mini.inl .c .big{display:none}.mini.inl .c .rk{font-size:11px}
.trickbox{position:relative;width:min(100%,260px);height:min(46vh,250px);margin:6px auto}
.slot{position:absolute;transition:transform .2s}.slot .c{--w:min(15vw,60px)}
.slot.pt{top:0;left:50%;transform:translateX(-50%)}.slot.pb{bottom:0;left:50%;transform:translateX(-50%)}
.slot.pr{right:0;top:50%;transform:translateY(-50%)}.slot.pl{left:0;top:50%;transform:translateY(-50%)}
.slot.win .c{box-shadow:0 0 0 3px var(--a),0 0 18px var(--a)}
.last{font-size:12px;color:var(--dim);text-align:center;min-height:16px}
.ladders{display:flex;flex-direction:column;gap:6px;width:100%;padding:6px 2px}
.lad{display:flex;align-items:center;gap:8px}.ls{font-size:22px;width:22px;text-align:center}
.lrow{display:flex;direction:ltr;overflow:hidden}.lrow .c{--w:26px;margin-right:-12px}.lrow .c:last-child{margin-right:0}
.hand .c.dim{filter:brightness(.55) saturate(.6)}
.dbl{display:flex;direction:ltr;gap:6px}.dbl .c{--w:34px;margin:0}.dbl .dsel .c{box-shadow:0 0 0 3px var(--red);transform:translateY(-6px)}
.bidb{min-width:44px}.suitb{font-size:15px}
@media(orientation:landscape) and (max-height:560px){.trickbox{height:min(52vh,190px)}.slot .c{--w:44px}}
@keyframes turn{0%,100%{box-shadow:0 0 0 3px var(--tc),0 0 0 6px rgba(255,255,255,.0)}50%{box-shadow:0 0 0 3px var(--tc),0 0 18px 6px var(--tc)}}
@keyframes pulse{50%{opacity:.75}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:520px){.mid{grid-template-columns:90px minmax(0,1fr) 90px}.mini .c{--w:34px}.av{width:54px;height:54px}}
/* landscape */
@media(orientation:landscape) and (max-height:560px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto}
  .partner{position:absolute;top:3px;left:100px;padding:0;z-index:4}
  .partner .av{width:34px;height:34px;font-size:14px}
  .top{padding:4px 8px}
  .mid{grid-template-columns:80px minmax(0,1fr) 80px}
  .board{flex-direction:row;flex-wrap:wrap;align-content:flex-start;border-radius:28px}
  .board .zone{flex:1 1 45%}.board .strip{order:-1;flex:1 1 100%}
  .bar{flex-direction:row;align-items:center;justify-content:center;padding:2px 10px}
  .mini .c{--w:28px}
}
</style>
</head>

<script>
{
const $app = document.getElementById('app');
const SUIT = { S: '♠', H: '♥', D: '♦', C: '♣' };
const RK = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
const TEAM = ['فريق أ', 'فريق ب'];
const TC = ['var(--a)', 'var(--b)'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  rot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 12a9 9 0 0 0 4 7M21 12a9 9 0 0 0-4-7"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  micoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z" transform="scale(-1,1) translate(-24,0)"/></svg>'
};

let db = null, uid = null, ready = false;
const ui = { view: 'home', mode: null, code: null, room: null, players: [], st: null, sel: new Set(), sheet: null, hidden: false, viewer: 0, busy: false, toast: null,
  order: {}, chat: [], chatOpen: false, unread: 0, bubbles: {}, confirmExit: false, orient: ls.get('mor-orient') || 'portrait', localCfg: null };
let unsub = [];
const MorG = { id: 'mor', name: 'مور', sub: 'فريقين · 14 ورقة ومورين', teams: true, rules: `<p>14 ورقة لكل لاعب ومورين كل واحد 11. بدورك: اسحب من السحبة أو خذ من الأرض (ورقة، أو من تحت مع كل اللي فوقها)، نزّل إذا بدك، وارمي ورقة. الورقة اللي بتاخدها لحالها من الأرض ما بترجّعها إلا إذا معك متلها.<br>
  سيري: 7–9 = 40 (مكسور 20)، 10–11 = 60 (40)، 12 = 80 (60)، 13 = 100 (80). الـ2 من شكل تاني أو الجوكر بيكسر.<br>
  متل بعض: 7 = 40 (20)، 8 = 80 (60)، بالجوكر بس.<br>

function trickTable() {

  const a = G.actor(st), myAct = a === me && me >= 0 && !ui.hidden;

  const R = (base + 1) % 4, P = (base + 2) % 4, L = (base + 3) % 4;
  const teamSum = t => st.game === 'tarneeb61' ? st.tscores[t] : st.scores[t] + st.scores[t + 2] + liveHs(st, t) + liveHs(st, t + 2);
  const pills = (G.teams || st.partner)
    ? `<span class="sp"><span class="dot" style="background:var(--a)"></span>${myT === 0 ? 'إحنا' : 'هم'} <b>${teamSum(0)}</b></span><span class="sp"><span class="dot" style="background:var(--b)"></span>${myT === 1 ? 'إحنا' : 'هم'} <b>${teamSum(1)}</b></span>`
    : `<span class="sp">إلك <b>${me >= 0 ? st.scores[me] + liveHs(st, me) : 0}</b></span>`;
  // info chips
  const chips = [];
  if (st.trump) chips.push(`<span class="ichip">الطرنيب <b class="${'HD'.includes(st.trump) ? 'red' : ''}">${SUIT[st.trump]}</b> ${Games.SN[st.trump]}</span>`);

  // centre
  let centre;
  if (st.phase === 'trix' || (G.trixFamily && st.contract === 'trix' && st.phase !== 'choose')) {
    centre = `<div class="ladders">${['S', 'H', 'C', 'D'].map(su => {
      const Lr = st.ladder[su]; let cards = '';
      if (Lr) for (let r = Lr[0]; r <= Lr[1]; r++) cards += cardHTML(su + r);
      return `<div class="lad"><span class="ls ${'HD'.includes(su) ? 'red' : ''}">${SUIT[su]}</span><div class="mini lrow">${cards || '<span class="empty">ناطر الشبّ</span>'}</div></div>`;
    }).join('')}</div>`;
  } else {
    const slot = (s, pos) => { const t = st.trick.find(x => x.seat === s); const win = st.trickDone && st.lastWinner === s; return `<div class="slot ${pos} ${win ? 'win' : ''}">${t ? cardHTML(t.card) : ''}</div>`; };
    centre = `<div class="trickbox">${slot(P, 'pt')}${slot(L, 'pl')}${slot(R, 'pr')}${slot(base, 'pb')}</div>`;
  }
  // status + actions
  let status = '', acts = '';
  const nm = s => esc(st.names[s]);
  if (a >= 0 && !myAct) status = { bid: 'عم يطلب', trump: 'عم يختار الطرنيب', choose: 'عم يختار الطلب', double: 'عم يقرّر الدبل', play: 'دوره', trix: 'دوره' }[st.phase] + ': ' + nm(a) + (st.bots[a] ? ' (بوت)' : '');
  if (myAct) {
    if (st.phase === 'bid' && st.game === 'tarneeb61') {
      const min = st.bid ? st.bid.val + 1 : 7; status = 'شو بتطلب؟';
      for (let v = min; v <= 13; v++) acts += `<button class="btn sm" data-a="bid" data-n="${v}">${v}</button>`;
      acts += `<button class="btn alt sm" data-a="bid" data-n="0">باس</button>`;
    } else if (st.phase === 'bid') {
      status = 'كم لمّة بتجيب؟';
      for (let v = 2; v <= 13; v++) acts += `<button class="btn ${v <= 5 ? '' : 'alt'} sm bidb" data-a="bid" data-n="${v}">${v}</button>`;
    } else if (st.phase === 'trump') {
      status = 'اختار الطرنيب';
      acts = ['S', 'H', 'C', 'D'].map(su => `<button class="btn alt sm suitb ${'HD'.includes(su) ? 'red' : ''}" data-a="trump" data-s="${su}">${SUIT[su]} ${Games.SN[su]}</button>`).join('');
    } else if (st.phase === 'choose') {
      status = 'مملكتك: اختار الطلب';
      acts = G.contracts.map((c, i) => st.used.includes(i) ? '' : `<button class="btn sm" data-a="choose" data-i="${i}">${Games.CN[c]}</button>`).join('');
    } else if (st.phase === 'double') {
      const el = G.dblCards(st, me); ui.dblSel = (ui.dblSel || []).filter(x => el.includes(x));
      status = 'بدك تدبّل؟ اختار الورق اللي بدك تدبّله';
      acts = `<div class="mini dbl">${el.map(c => `<span data-a="dblT" data-c="${c}" class="${ui.dblSel.includes(c) ? 'dsel' : ''}">${cardHTML(c)}</span>`).join('')}</div>
        <button class="btn sm" data-a="dblDone">${ui.dblSel.length ? 'دبّل (' + ui.dblSel.length + ')' : 'بدون دبل'}</button>`;
    } else if (st.phase === 'play') status = 'دورك: العب ورقة';
    else if (st.phase === 'trix') { status = legalSet.length ? 'دورك: نزّل ورقة على الأرض' : 'ما معك ورقة بتركب'; if (!legalSet.length) acts = `<button class="btn sm" data-a="trixPass">باس</button>`; }
  }
  const last = st.log[st.log.length - 1] || '';
  const chatBtn = ui.mode === 'lan' ? `<button class="ic" data-a="chat" aria-label="الدردشة">${ICON.chat}${ui.unread ? `<span class="badge">${ui.unread}</span>` : ''}</button>
    <button class="ic ${vc.on ? (vc.muted ? 'vmute' : 'von') : ''}" data-a="voice" aria-label="المكالمة">${vc.on ? (vc.muted || !vc.stream ? ICON.micoff : ICON.mic) : ICON.phone}</button>` : '';
  return `<div class="game tg">
  <div class="top"><button class="ic" data-a="exit" aria-label="طلاع">${ICON.x}</button><div class="score">${pills}<span class="sp">${esc(G.name)}</span></div>${chatBtn}${native ? `<button class="ic" data-a="rotate" aria-label="تدوير">${ICON.rot}</button>` : ''}</div>
  <div class="partner">${seatT(st, P, me)}</div>
  <div class="mid">${seatT(st, R, me)}<div class="board tboard"><div class="chips">${chips.join('')}</div>${centre}<div class="last">${esc(last)}</div></div>${seatT(st, L, me)}</div>
  <div class="bar"><div class="status">${status}</div>${acts ? `<div class="acts2">${acts}</div>` : ''}</div>
  <div class="handwrap"><div class="hand" id="hand">${hand.map(id => cardHTML(id, legalSet && !legalSet.includes(id) ? 'dim' : '')).join('')}</div></div>
  </div>${overlays2(me)}`;
}
function overlays2(me) {
  const st = ui.st, G = gameOf(st); let h = '';
  if (ui.confirmExit) h += `<div class="ov"><div class="box"><h2>بدك تطلع؟</h2><p class="muted">${ui.mode === 'local' ? 'اللعبة بتنحفظ وفيك تكمّلها بعدين.' : 'فيك ترجع للغرفة بعدين من الصفحة الرئيسية.'}</p><div class="acts"><button class="btn red" data-a="leave">إيه، اطلع</button><button class="btn alt" data-a="stay">لا، كمّل</button></div></div></div>`;
  else if (ui.mode === 'local' && ui.hidden && G.actor(st) >= 0) h += `<div class="ov"><div class="box" style="text-align:center"><h2>دور ${esc(st.names[G.actor(st)])}</h2><p class="muted">سلّموه الجوال، وما حدا يطلّع.</p><button class="btn" data-a="reveal">شوف ورقي</button></div></div>`;
  else if (st.phase === 'handEnd' || st.phase === 'over') {
    const S = st.summary || { rows: [], notes: [] };
    const cols = S.kind === 'team' ? [TEAM[0], TEAM[1]] : st.names;
    let title = 'خلصت الجولة';
    if (st.phase === 'over') title = st.winner != null ? 'ربح ' + TEAM[st.winner] + '!' : 'ربح ' + st.names[st.winnerSeat] + '!';
    const teamRow = S.kind === 'players' && (G.teams || st.partner) ? `<tr><td>مجموع الفريق</td>${[0, 1, 2, 3].map(i => `<td><b>${st.scores[i % 2] + st.scores[i % 2 + 2]}</b></td>`).join('')}</tr>` : '';
    h += `<div class="ov"><div class="box"><h2>${title}</h2>
    <div class="scroll"><table><tr><th></th>${cols.map((c, i) => `<th style="color:${S.kind === 'team' ? TC[i] : (G.teams || st.partner ? TC[i % 2] : 'inherit')}">${esc(c)}</th>`).join('')}</tr>
    ${S.rows.map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}${teamRow}</table></div>
    <p class="muted">${(S.notes || []).map(esc).join('<br>')}</p>
    ${ui.mode === 'local' || me >= 0 ? `<div class="acts">${st.phase === 'over' ? '<button class="btn" data-a="newMatch">لعبة جديدة</button>' : '<button class="btn" data-a="nextRound">الجولة الجاية</button>'}<button class="btn alt" data-a="exit">طلاع</button></div>` : ''}</div></div>`;
  }
  if (ui.chatOpen && ui.mode === 'lan') h += chatPanel();
  if (ui.toast) h += `<div class="toast" role="status">${esc(ui.toast)}</div>`;
  return h;
}

function chatPanel() { return `<div class="ov" data-a="chatClose" style="background:rgba(0,0,0,.3)"></div><div class="chat"><div class="row" style="justify-content:space-between"><b>الدردشة</b>${vc.on ? `<button class="chip" data-a="voiceLeave">اطلع من المكالمة</button>` : `<button class="chip on" data-a="voice">ادخل المكالمة</button>`}<button class="ic" data-a="chatClose" aria-label="سكّر">${ICON.x}</button></div>
    <div class="msgs" id="msgs">${ui.chat.map(m => `<div class="msg ${m.id === uid ? 'me' : ''}"><small>${esc(m.name)}</small>${m.audio ? `<button class="chip" data-a="play" data-m="${m.mid}">▶ رسالة صوتية</button>` : esc(m.text)}</div>`).join('') || '<div class="muted">ما في رسائل لسا</div>'}</div>
    <div class="row"><input id="chatin" class="grow" placeholder="اكتب رسالة" maxlength="200"><button class="ic" data-a="send" aria-label="ابعت">${ICON.send}</button><button class="mic ${rec.mr ? 'rec' : ''}" id="mic" aria-label="اضغط مطوّل وسجّل">${ICON.mic}</button></div>
    <div class="muted">اضغط مطوّل على المايك وسجّل، وشيل إصبعك لتبعت.</div></div>`; }
// ---------- hand layout & drag ----------
function layoutHand() {
  const el = document.getElementById('hand'); if (!el) return;
  const cards = [...el.children]; const n = cards.length; if (!n) { el.style.height = '0'; return; }
  const land = matchMedia('(orientation:landscape) and (max-height:560px)').matches;
  const W = el.parentElement.clientWidth - 16;
  let w = land ? 46 : Math.min(64, Math.max(48, W / 7.2));
  const rows = (!land && n > 16) ? 2 : 1;
  const perRow = Math.ceil(n / rows);
  let step = Math.min(w * 0.62, (W - w) / Math.max(1, perRow - 1));
  const h = w * 1.42, rowGap = h * 0.55;
  el.style.width = W + 'px'; el.style.height = (h + (rows - 1) * rowGap + 18) + 'px';
  const pos = [];
  cards.forEach((c, i) => {
    const r = Math.floor(i / perRow), k = i % perRow, cnt = Math.min(perRow, n - r * perRow);
    const total = w + step * (cnt - 1), x0 = (W - total) / 2;
    const x = x0 + k * step, y = 16 + r * rowGap;
    c.style.setProperty('--w', w + 'px'); c.style.left = x + 'px'; c.style.top = y + 'px'; c.style.zIndex = i + 1;
    pos.push({ x, y, id: c.dataset.id });
  });
  el._pos = pos; el._w = w; el._step = step;
}
let drag = null;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('#hand .c'); if (!c) return;
  const el = document.getElementById('hand');
  drag = { id: c.dataset.id, el: c, sx: e.clientX, sy: e.clientY, moved: false, ox: parseFloat(c.style.left), oy: parseFloat(c.style.top), hand: el };
  c.setPointerCapture && c.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true; drag.el.classList.add('drag');
  drag.el.style.left = drag.ox + dx + 'px';
  drag.el.style.top = drag.oy + dy + 'px';
});
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) {
    const id = d.id;
    if (ui.st && gameOf(ui.st).id !== 'mor') return tapCard(id);
    ui.sel.has(id) ? ui.sel.delete(id) : ui.sel.add(id); return render();
  }
  const me = mySeat(); const order = ui.order[me]; if (!order) return render();
  const x = parseFloat(d.el.style.left) + d.hand._w / 2, y = parseFloat(d.el.style.top);
  let best = 0, bd = Infinity;
  d.hand._pos.forEach((p, i) => { const dd = Math.abs(p.x + d.hand._w / 2 - x) + Math.abs(p.y - y) * 2; if (dd < bd) { bd = dd; best = i; } });
  const from = order.indexOf(d.id); order.splice(from, 1); order.splice(best, 0, d.id);
  render();
});
document.addEventListener('pointercancel', () => { if (drag) { drag = null; render(); } });

function tapCard(id) {
  const st = ui.st, G = gameOf(st), me = mySeat();
  if (G.actor(st) !== me || ui.hidden) return;
  if (st.phase === 'play') return act(G.play, id);
  if (st.phase === 'trix') return act(G.trixPlay, id);
  if (st.phase === 'double' && G.dblCards(st, me).includes(id)) { ui.dblSel = ui.dblSel || []; ui.dblSel.includes(id) ? ui.dblSel.splice(ui.dblSel.indexOf(id), 1) : ui.dblSel.push(id); render(); }
}
function render() {
  const disc = document.getElementById('disc'); const dscroll = disc ? disc.scrollLeft : null;
  const msgs = document.getElementById('msgs'); const chatVal = document.getElementById('chatin')?.value;
  $app.innerHTML = !ready ? '<div class="menu"><div class="in"><h1>مور</h1><p class="muted">عم يحمّل…</p></div></div>' : ui.view === 'home' ? home() : ui.view === 'pick' ? gamePage() : ui.view === 'room' ? lobby() : !ui.st ? lobby() : gameOf(ui.st).id === 'mor' ? game() : trickTable();
  layoutHand();
  const d2 = document.getElementById('disc'); if (d2) d2.scrollLeft = d2.scrollWidth;
  const m2 = document.getElementById('msgs'); if (m2) m2.scrollTop = m2.scrollHeight;
  const ci = document.getElementById('chatin'); if (ci && chatVal) ci.value = chatVal;
  if (ui.chatOpen) ui.unread = 0;
}
window.addEventListener('resize', () => layoutHand());

// ---------- events ----------
$app.addEventListener('click', e => {
  let t = e.target.closest('[data-a]');
  if (t && t.classList.contains('ov') && e.target.closest('[data-stop]')) return;
  if (t && !t.dataset.a) t = null;
  if (!t) t = e.target.closest('[data-di]') || e.target.closest('[data-meld]') || e.target.closest('[data-seat]');
  if (!t) return;
  const a = t.dataset.a, st = ui.st;
  if (a) {
    e.stopPropagation();
    ({
      create: () => createRoom('online'), join: () => joinRoom('online', document.getElementById('code').value), createLan: () => createRoom('lan'),
      joinLan: () => joinRoom('lan', document.getElementById('ip').value), joinHere: () => joinRoom('lan', location.hostname),
      rejoin: () => { const r = ls.get('mor-room'); ui.gameId = ui.gameId || 'mor'; joinRoom(r.mode, r.key); },
      solo: () => startLocal('solo'), local: () => startLocal('pass'), localResume: () => startLocal(null, true),
      cfgBot: () => { ui.localCfg[+t.dataset.s] = !ui.localCfg[+t.dataset.s]; const v = [0, 1, 2, 3].map(i => document.getElementById('ln' + i)?.value || ''); render(); v.forEach((x, i) => { const el = document.getElementById('ln' + i); if (el) el.value = x; }); },
      exit: () => { ui.confirmExit = true; render(); }, stay: () => { ui.confirmExit = false; render(); }, leave,
      start: () => startOnline(false), startBots: () => startOnline(true), sit: () => sit(+t.dataset.s),
      draw: () => act(Mor.draw), meld: () => act(Mor.meldNew, [...ui.sel]), discard: () => act(Mor.discard, [...ui.sel][0]),
      declMor: () => act(Mor.declare, 'mor'), declClose: () => act(Mor.declare, 'close'), undecl: () => act(Mor.undeclare),
      morNow: () => act(Mor.takeMorNow), chooseMor: () => act(Mor.chooseMor), close: () => act(Mor.close),
      sort: () => { const me = mySeat(); const h = ui.st.hands[me]; const cur = ui.order[me] || []; const s1 = sortIds(h, false); ui.order[me] = cur.join() === s1.join() ? sortIds(h, true) : s1; render(); },
      reveal: () => { ui.hidden = false; render(); }, nextRound, newMatch,
      noSheet: () => { ui.sheet = null; render(); }, sheet: () => { const o = ui.sheet.opts[+t.dataset.i]; ui.sheet = null; o.run(); },
      chat: () => { ui.chatOpen = true; ui.unread = 0; render(); setTimeout(() => document.getElementById('chatin')?.focus(), 50); },
      chatClose: () => { ui.chatOpen = false; render(); }, send: sendChat, play: () => playVoice(t.dataset.m),
      voice: () => (vc.on ? voiceMute() : voiceJoin()), voiceLeave: () => voiceLeave(),
      pick: () => { ui.gameId = t.dataset.g; ui.view = 'pick'; ui.localCfg = [false, false, false, false]; render(); window.scrollTo(0, 0); },
      back: () => { ui.view = 'home'; ui.gameId = null; render(); },
      bid: () => act(gameOf(ui.st).bid, +t.dataset.n), trump: () => act(gameOf(ui.st).chooseTrump, t.dataset.s),
      choose: () => act(gameOf(ui.st).choose, +t.dataset.i),
      dblT: () => { const c = t.dataset.c; ui.dblSel = ui.dblSel || []; ui.dblSel.includes(c) ? ui.dblSel.splice(ui.dblSel.indexOf(c), 1) : ui.dblSel.push(c); render(); },
      dblDone: () => { const sel = (ui.dblSel || []).slice(); ui.dblSel = []; act(gameOf(ui.st).double, sel); },
      trixPass: () => act(gameOf(ui.st).trixPlay, null),
      rotate: () => setOrient(ui.orient === 'portrait' ? 'landscape' : 'portrait')
    }[a] || (() => {}))();
    return;
  }
  if (t.dataset.di != null && st && st.turn === mySeat() && st.step === 'draw' && !ui.hidden) {
    const i = +t.dataset.di, n = st.discard.length - i;
    if (n === 1) return act(Mor.takeDiscard, i);
    ui.sheet = { title: `تاخد ${n} ورقات من الأرض؟`, opts: [{ label: 'إيه خدهم', run: () => act(Mor.takeDiscard, i) }] }; return render();
  }
  if (t.dataset.meld) {
    const m = st.melds.find(x => x.id === t.dataset.meld); const me = mySeat();
    if (!m || !ui.sel.size || st.turn !== me || st.step !== 'play' || m.team !== Mor.teamOf(me)) return;
    const ids = [...ui.sel], opts = [];
    if (Mor.analyze([...m.cards, ...ids])) opts.push({ label: 'زيد على التنزيلة', run: () => act(Mor.addToMeld, m.id, ids) });
    const sw = ids.length === 1 ? Mor.swapOptions(m, ids[0]) : [];
    if (sw.length) opts.push({ label: sw.some(o => Mor.isJ(o.w)) ? 'فكّ الجوكر بهالورقة' : 'بدّل الـ2', run: () => act(Mor.swapWild, m.id, ids[0]) });
    if (!opts.length) return toast('الورق المختار ما بيركب على هالتنزيلة');
    if (opts.length === 1) return opts[0].run();
    ui.sheet = { title: 'شو بدك تعمل؟', opts }; return render();
  }
  if (t.dataset.seat != null && st && ui.mode !== 'local' && isHost() && +t.dataset.seat !== mySeat()) {
    const s = +t.dataset.seat;
    ui.sheet = { title: esc(st.names[s]), opts: [{ label: st.bots[s] ? 'رجّعه يلعب بنفسه' : 'خلّي بوت يلعب مكانه', run: () => toggleBot(s) }] }; render();
  }
});
$app.addEventListener('input', e => { if (e.target.id === 'nm') ls.set('mor-name', e.target.value.trim()); });
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'code') joinRoom('online', e.target.value);
  if (e.target.id === 'ip') joinRoom('lan', e.target.value);
  if (e.target.id === 'chatin') sendChat();
});
$app.addEventListener('pointerdown', e => { if (e.target.closest('#mic')) { e.preventDefault(); recStart(); } });
document.addEventListener('pointerup', () => { if (rec.mr) recStop(); });
setInterval(() => { if (Object.values(ui.bubbles).some(b => Date.now() - b.t < 4600 && Date.now() - b.t > 4000)) render(); }, 600);

// ---------- boot ----------
(async () => {
  let id = ls.get('mor-uid'); if (!id) { id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); ls.set('mor-uid', id); }
  uid = id;
  try { native && native.setOrientation(ui.orient); } catch (e) {}
  if (isServed) { ready = true; return render(); }
  const tm = setTimeout(() => { ready = true; render(); }, 10000);
  try {
    const [d, u] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]);
    if (d && u) { const cid = await u.id(); if (cid) { db = d; uid = cid; } }
  } catch (e) {}
  clearTimeout(tm); ready = true; render();
})();
render();
}
</script>
