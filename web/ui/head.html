<!DOCTYPE html>
<html lang="ar" dir="rtl" data-skin="royal" data-cards="classic" data-back="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سهرة ورق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oswald:wght@500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* VOICE: a late-night majlis card evening, premium and calm
   IDEA: a private card salon: navy walls, gold trim, a green baize table under a warm lamp
   PICTURE: the table itself is the hero in every game; menus are gold-trimmed cards on navy
   COLOUR and TYPE: navy + gold + baize green (royal); 3 alternate skins; Cairo for Arabic, Playfair/Oswald for card indices
   LAYOUT: one primary action per screen, bottom nav on home, seats around an oval table, hand fanned at the bottom */
:root{--bg1:#16224a;--bg2:#070b1d;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.09);--line:rgba(217,180,90,.22);--line2:rgba(255,255,255,.1);
  --gold:#e2bf68;--gold2:#b58a2e;--ink:#f6f1e3;--dim:#a7aec4;--felt1:#18704b;--felt2:#0c4630;--rim1:#3a2a14;--rim2:#7a5a26;
  --a:#e2bf68;--b:#5fb8ec;--red:#d8343f;--ok:#3bbf7a;--btnink:#1d1404;--card:#fffdf7;--card2:#f3ecda;--cink:#15171c;--cred:#c8202d;
  color-scheme:dark}
:root[data-skin=classic]{--bg1:#4a2e1a;--bg2:#1c0f07;--panel:rgba(255,240,210,.06);--panel2:rgba(255,240,210,.1);--line:rgba(232,200,140,.25);--gold:#e8c07a;--gold2:#a77a35;--dim:#cbb79a;--felt1:#1f7a45;--felt2:#0f4a28;--rim1:#2a1408;--rim2:#8a5a2a;--a:#e8c07a;--b:#8fd0c0}
:root[data-skin=night]{--bg1:#16181d;--bg2:#050506;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(79,209,197,.25);--gold:#4fd1c5;--gold2:#2a8f87;--dim:#9aa3ad;--felt1:#13454a;--felt2:#081f22;--rim1:#0b0c0e;--rim2:#2d3238;--a:#4fd1c5;--b:#f6ad55;--btnink:#03201d}
:root[data-skin=vivid]{--bg1:#0f4c75;--bg2:#08223a;--panel:rgba(255,255,255,.08);--panel2:rgba(255,255,255,.13);--line:rgba(255,200,87,.35);--gold:#ffc857;--gold2:#ff7a59;--dim:#b9d3e6;--felt1:#22a06b;--felt2:#11663f;--rim1:#ff7a59;--rim2:#ffc857;--a:#ffc857;--b:#7be0ff;--btnink:#3a1800}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--bg1),var(--bg2) 70%);color:var(--ink);font:15px/1.5 Cairo,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;font-size:16px;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--ink);width:100%;user-select:text;-webkit-user-select:text}
input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--dim);font-size:13px}
.gold{color:var(--gold)}
h1,h2,h3{margin:0;line-height:1.2}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 18px;border-radius:14px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--btnink);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn svg,.chip svg,.li svg{width:20px;height:20px;flex:none}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:linear-gradient(180deg,#ef5a63,#b81f2b);color:#fff}
.btn.sky{background:linear-gradient(180deg,#86d2f4,#3a9fd0);color:#03202e}
.btn.sm{min-height:38px;padding:4px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;pointer-events:none}
.ic{width:40px;height:40px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line2)}
.ic svg{width:20px;height:20px}
.ic.on{background:var(--gold);color:var(--btnink)}
.ic.von{background:var(--b);color:#03212d}.ic.vmute{background:var(--red);color:#fff}
.badge{position:absolute;top:-5px;left:-5px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap}
.chip.on{background:var(--gold);color:var(--btnink);box-shadow:none}
.tag{display:inline-block;font-size:10.5px;padding:0 7px;border-radius:8px;background:rgba(0,0,0,.45);margin:1px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 140px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sep{height:1px;background:var(--line);margin:14px 0}
/* screens */
.scr{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:max(14px,env(safe-area-inset-top)) max(4vw,14px) 110px}
.scr .in{max-width:640px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{font-size:18px;margin-bottom:4px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hdr h1{font-size:24px;flex:1}
.brand{text-align:center;margin:10px 0 4px}
.brand h1{padding-bottom:8px;font:800 40px/1.25 Cairo,sans-serif;letter-spacing:-.5px;background:linear-gradient(180deg,#fff6dc,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .muted{font-size:14px}
.fanlogo{position:relative;margin:0 auto}
.fanlogo .c{position:absolute;bottom:0;transform-origin:50% 130%}
.me-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line2)}
.me-bar .nm{font-weight:800;font-size:16px}
.big-act{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:22px;text-align:start;margin:10px 0;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 10px 28px rgba(0,0,0,.28)}
.big-act.main{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--btnink);border:0}
.big-act .bi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(0,0,0,.18);flex:none}
.big-act.main .bi{background:rgba(255,255,255,.28)}
.big-act .bi svg{width:28px;height:28px}
.big-act b{display:block;font-size:19px}
.big-act span{font-size:13px;opacity:.8}
.big-act:active{transform:scale(.985)}
.resume{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.resume .chip{flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg2) 30%);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--dim);padding:6px 12px;border-radius:14px;position:relative;min-width:64px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--gold);background:var(--panel)}
.nav .badge{top:2px;left:12px}
/* avatar */
.avt{--s:44px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--s)*.44);color:#fff;flex:none;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.15)}
.avt img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avt.lg{--s:84px}.avt.sm{--s:34px}.avt.xs{--s:26px}
.avpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}
.avpick button{display:grid;place-items:center;padding:4px;border-radius:50%}
.avpick button.on .avt{box-shadow:0 0 0 3px var(--gold)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.swatches button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.swatches button.on{box-shadow:0 0 0 3px var(--gold)}
/* option tiles (themes, cards) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{border-radius:18px;padding:10px;background:var(--panel);border:1px solid var(--line2);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tile .sw{width:100%;height:54px;border-radius:12px;position:relative;overflow:hidden}
.tile .sw i{position:absolute;inset:auto 12% 10% 12%;height:46%;border-radius:40px/20px}
.tile .cards{display:flex;justify-content:center;direction:ltr}.tile .cards .c{--w:40px;margin:0 -6px}
/* games grid */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;margin-top:10px}
.gentry{position:relative;display:flex}
.gcard{width:100%;position:relative;padding:12px 10px 12px;border-radius:20px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:150px}
.gcard.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(0,0,0,.3)}
.gcard b{font-size:15.5px}.gcard .muted{font-size:11.5px;line-height:1.35}
.gentry .info{position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--gold)}
.gentry .info span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.4)}
.gentry .info:focus-visible{outline-offset:-3px}
.saved-games .resume{flex-wrap:wrap;overflow:visible;margin-top:9px}
.saved-games .chip{min-height:44px}
.ov.handoff{background:var(--bg2);backdrop-filter:none}
.gcard .saved{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(0,0,0,.3);gap:4px}
.seg button{flex:1;min-height:38px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
/* room */
.roomcode{font:600 44px/1 Oswald,sans-serif;letter-spacing:8px;direction:ltr;color:var(--gold);text-align:center}
.minitable{position:relative;height:250px;margin:14px auto 4px;max-width:360px}
.minitable .felt{position:absolute;inset:48px 60px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--felt1),var(--felt2));box-shadow:0 0 0 7px var(--rim2),0 0 0 10px var(--rim1),0 18px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.4);display:grid;place-items:center;text-align:center;font-size:12px;color:rgba(255,255,255,.75)}
.minitable .st{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;width:96px;font-size:12px;font-weight:700}
.minitable .st.s0{bottom:0;left:50%;transform:translateX(-50%)}.minitable .st.s2{top:0;left:50%;transform:translateX(-50%)}
.minitable .st.s1{right:0;top:50%;transform:translateY(-50%)}.minitable .st.s3{left:0;top:50%;transform:translateY(-50%)}
.minitable .empty-seat{width:50px;height:50px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--gold);font-size:22px}
.minitable .st.me .avt{box-shadow:0 0 0 3px var(--gold)}
.minitable .team{font-size:10px;color:var(--dim)}
.spect{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gsel{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.gsel b{font-size:18px}
.gemo{display:grid;place-items:center;height:1.4em;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .t{flex:1}.li .t b{display:block;font-size:15px}.li .t span{font-size:12.5px;color:var(--dim)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:16px 0}
/* chat view */
.chatv{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.chatv .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2);background:var(--bg2)}
.chatv .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.chatv .inp{display:flex;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:var(--bg2)}
.msg{max-width:80%;padding:7px 12px;border-radius:16px;background:var(--panel2);align-self:flex-start;font-size:14.5px;user-select:text;-webkit-user-select:text}
.msg.me{align-self:flex-end;background:var(--gold);color:var(--btnink)}
.msg small{display:block;font-size:11px;opacity:.7;font-weight:700}
.msg.inv{border:1px solid var(--gold);background:var(--panel)}
.msg.me.inv{color:var(--ink)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(3,6,16,.66);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .15s;backdrop-filter:blur(3px)}
.ov.cen{align-items:center;padding:16px}
.box{background:linear-gradient(180deg,var(--bg1),var(--bg2));border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.5);animation:up .22s cubic-bezier(.2,.8,.3,1);touch-action:pan-y}
.ov.cen .box{border-radius:24px}
.box h2{font-size:21px;margin-bottom:6px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:-6px auto 12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:center}th:first-child,td:first-child{text-align:start}
.scroll{overflow-x:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1e2436;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:14px;z-index:90;font-weight:700;max-width:92vw;box-shadow:0 10px 28px rgba(0,0,0,.5);text-align:center;animation:pop .2s}
.rules p{margin:6px 0 10px;line-height:1.75;font-size:14.5px;user-select:text;-webkit-user-select:text}
.rank{display:flex;gap:12px;align-items:center}
.lvl{width:58px;height:58px;border-radius:18px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--btnink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.lvl b{font:600 24px/1 Oswald,sans-serif}.lvl span{font-size:10px;font-weight:700}
.mrow{padding:7px 0;border-bottom:1px solid var(--line2)}
input[type=range]{min-height:0;padding:0;accent-color:var(--gold);background:none;border:0}
/* ---------- cards ---------- */
.c{--w:56px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.11);background:linear-gradient(165deg,var(--card),var(--card2));color:var(--cink);position:relative;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.2);overflow:hidden;direction:ltr;text-align:left}
.c.r{color:var(--cred)}
.c .ix,.c .ix2{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;left:calc(var(--w)*.05);top:calc(var(--w)*.06);width:calc(var(--w)*.3)}
.c .ix b,.c .ix2 b{font:700 calc(var(--w)*.3)/1 'Playfair Display',Georgia,serif;letter-spacing:-1px}
.c .ix i,.c .ix2 i{font-style:normal;font-size:calc(var(--w)*.22);margin-top:1px}
.c .ix2{left:auto;top:auto;right:calc(var(--w)*.05);bottom:calc(var(--w)*.06);transform:rotate(180deg)}
.c .pips{position:absolute;inset:0;display:var(--pip)}
.c .pips i{position:absolute;font-style:normal;font-size:calc(var(--w)*.18);transform:translate(-50%,-50%);line-height:1}
.c .pips i.f{transform:translate(-50%,-50%) rotate(180deg)}
.c .ace{position:absolute;inset:0;place-items:center;font-size:calc(var(--w)*.62);display:var(--ace)}
.c .court{position:absolute;inset:calc(var(--w)*.2) calc(var(--w)*.19);border:1.5px solid currentColor;border-radius:calc(var(--w)*.06);flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(226,191,104,.28),rgba(226,191,104,.08));display:var(--court)}
.c .court svg{width:62%;height:auto}
.c .court b{font:800 calc(var(--w)*.3)/1 'Playfair Display',Georgia,serif}
.c .big{display:var(--big);position:absolute;right:calc(var(--w)*.06);bottom:calc(var(--w)*.02);font-size:calc(var(--w)*.62);line-height:1}
.c .ix2{display:var(--ix2)}
.c .ix b{font-size:calc(var(--w)*var(--ixb))}.c .ix i{font-size:calc(var(--w)*var(--ixi))}.c .ix{width:calc(var(--w)*var(--ixw))}
.c.s-S{color:var(--cS)}.c.s-C{color:var(--cC)}.c.s-H{color:var(--cH)}.c.s-D{color:var(--cD)}
[data-cards]{--pip:none;--ace:none;--court:none;--big:none;--ix2:block;--ixb:.3;--ixi:.22;--ixw:.3;--cS:var(--cink);--cC:var(--cink);--cH:var(--cred);--cD:var(--cred)}
[data-cards=classic]{--pip:block;--ace:grid;--court:flex;--ixb:.27;--ixi:.19;--ixw:.25}
[data-cards=modern]{--big:block;--ix2:none}
[data-cards=four]{--big:block;--ix2:none;--cD:#1d6fd6;--cC:#1b8a3c;--cH:#d0202d}
[data-cards=jumbo]{--ix2:none;--ixb:.5;--ixi:.4;--ixw:.5}
[data-cards=jumbo] .c .ix b{font-family:Oswald,sans-serif}
/* clear: bold oversized index readable in a tight fan, big suit at the bottom, court art kept */
[data-cards=clear]{--ix2:none;--big:block;--court:flex;--ace:none;--ixb:.46;--ixi:.36;--ixw:.42}
[data-cards=clear] .c{background:#fff;border:1px solid rgba(0,0,0,.18)}
[data-cards=clear] .c .ix{left:calc(var(--w)*.04);top:calc(var(--w)*.04)}
[data-cards=clear] .c .ix b{font:700 calc(var(--w)*.46)/.95 Oswald,'Arial Narrow',sans-serif;letter-spacing:-1px}
[data-cards=clear] .c .court{inset:calc(var(--w)*.62) calc(var(--w)*.08) calc(var(--w)*.08) calc(var(--w)*.42);border-width:1px}
[data-cards=clear] .c .court b{display:none}
[data-cards=clear] .c .big{font-size:calc(var(--w)*.5)}
[data-cards=clear] .c.s-K .big,[data-cards=clear] .c:has(.court) .big{display:none}
/* luxe: engraved classic with gold inner frame and serif indices */
[data-cards=luxe]{--pip:block;--ace:grid;--court:flex;--ixb:.28;--ixi:.19;--ixw:.25}
[data-cards=luxe] .c{background:linear-gradient(160deg,#fffdf6,#f4ead2);box-shadow:inset 0 0 0 calc(var(--w)*.035) #fffdf6,inset 0 0 0 calc(var(--w)*.05) #b8913e,0 3px 8px rgba(0,0,0,.35)}
[data-cards=luxe] .c .ix b,[data-cards=luxe] .c .ix2 b{font-family:'Playfair Display',Georgia,serif;font-weight:800}
[data-cards=luxe] .c .court{background:linear-gradient(180deg,rgba(184,145,62,.35),rgba(184,145,62,.08));border-color:#b8913e}

.reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.reacts button{min-height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);font-size:20px;font-weight:800}
.tut{text-align:center}.tut .ti{font-size:52px;line-height:1.2}.tut p{font-size:15.5px;line-height:1.8;margin:8px 0 14px}
.tut .dots{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}.tut .dots i{width:8px;height:8px;border-radius:50%;background:var(--line2)}.tut .dots i.on{background:var(--gold)}
/* replay */
.rpbar{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:85;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:18px;background:rgba(10,14,30,.94);border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6);white-space:nowrap}
.rpbar b{font:600 13px Oswald,sans-serif;color:var(--gold)}.rpbar .ic{width:36px;height:36px}
/* discard picker */
.dpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin:12px 0;direction:ltr}
.dp{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px;border-radius:12px;opacity:.45;transition:opacity .15s,transform .15s}
.dp .c{--w:52px}.dp.on{opacity:1}.dp.on .c{box-shadow:0 0 0 2px var(--gold)}.dp.first .c{box-shadow:0 0 0 3px var(--gold),0 0 14px var(--gold);transform:translateY(-4px)}
.dp .dn{font:600 11px Oswald,sans-serif;color:var(--dim)}
/* turn timer */
.tmr{position:absolute;top:-8px;left:-6px;z-index:3;min-width:28px;height:28px;border-radius:14px;padding:0 6px;display:grid;place-items:center;background:var(--gold);color:var(--btnink);font:600 15px Oswald,sans-serif;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.status .tmr{position:static;margin-inline-end:6px}
.tmr.low{background:var(--red);color:#fff;animation:pulse .6s infinite}
/* flights */
.flyer{position:fixed;left:0;top:0;z-index:80;pointer-events:none}.flyer .c{--w:46px;box-shadow:0 12px 24px rgba(0,0,0,.5)}
.flabel{position:fixed;z-index:81;transform:translateX(-50%);pointer-events:none;background:rgba(10,14,30,.92);border:1px solid var(--gold);color:#fff;font-weight:800;font-size:13px;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:flab 2.3s ease forwards}
@keyframes flab{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
/* animations */
@keyframes turn{0%,100%{box-shadow:0 0 0 3px var(--tc),0 0 0 0 transparent}50%{box-shadow:0 0 0 3px var(--tc),0 0 22px 6px var(--tc)}}
@keyframes pulse{50%{opacity:.7}}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes inB{from{transform:translateY(170px) scale(.8) rotate(-6deg);opacity:.2}}@keyframes inT{from{transform:translateY(-170px) scale(.8) rotate(6deg);opacity:.2}}
@keyframes inL{from{transform:translateX(-150px) scale(.8) rotate(-8deg);opacity:.2}}@keyframes inR{from{transform:translateX(150px) scale(.8) rotate(8deg);opacity:.2}}
.c.in-pb{animation:inB .6s cubic-bezier(.2,.8,.3,1)}.c.in-pt{animation:inT .6s cubic-bezier(.2,.8,.3,1)}.c.in-pl{animation:inL .6s cubic-bezier(.2,.8,.3,1)}.c.in-pr{animation:inR .6s cubic-bezier(.2,.8,.3,1)}
@keyframes toB{to{transform:translateY(180px) scale(.4) rotate(10deg);opacity:0}}@keyframes toT{to{transform:translateY(-180px) scale(.4) rotate(-10deg);opacity:0}}
@keyframes toL{to{transform:translateX(-160px) scale(.4);opacity:0}}@keyframes toR{to{transform:translateX(160px) scale(.4);opacity:0}}
.trickbox.collect .c{animation-duration:.7s;animation-timing-function:ease-in;animation-fill-mode:forwards;animation-delay:var(--cd)}
.trickbox.c-pb .c{animation-name:toB}.trickbox.c-pt .c{animation-name:toT}.trickbox.c-pl .c{animation-name:toL}.trickbox.c-pr .c{animation-name:toR}
@keyframes deal{from{transform:translateY(-240px) rotate(-10deg) scale(.7);opacity:0}}
.hand .c.deal{animation:deal .4s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes drop{from{transform:translateY(-90px) scale(1.15) rotate(-6deg);opacity:.3}}
.disc .c.drop{animation:drop .3s cubic-bezier(.2,.8,.3,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:520px){.mid{grid-template-columns:84px minmax(0,1fr) 84px}.mini .c{--w:34px}.seatv .avt{--s:48px}}
@media(orientation:landscape) and (max-height:560px){
  .game{grid-template-rows:auto minmax(0,1fr) auto auto}
  .partner{position:absolute;top:4px;left:110px;padding:0;z-index:4}.partner .avt{--s:34px}
  .top{padding:4px 8px}.mid{grid-template-columns:84px minmax(0,1fr) 84px}
  .board{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  .board .zone{flex:1 1 45%}.board .strip{order:-1;flex:1 1 100%}
  .bar{flex-direction:row;align-items:center;justify-content:center;padding:2px 10px}
  .mini .c{--w:28px}.trickbox{height:min(52vh,190px)}.slot .c{--w:46px}
}
.nbanner{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(94vw,440px);z-index:95;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#232b42,#1a2033);border:1px solid var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.55);color:var(--ink);text-align:start;animation:nslide .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes nslide{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
.nic{font-size:26px;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.07);flex:none}
.ntx{flex:1;display:flex;flex-direction:column;min-width:0}.ntx b{font-size:14px}.ntx span{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ntx small{font-size:11px;color:var(--mut);opacity:.7}
.ngo{font-weight:800;color:var(--gold);font-size:13px}
.bellbtn{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:14px;font-size:20px;z-index:5}
.nlist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:60vh;overflow:auto}
.nitem{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);text-align:start}.nitem.new{border-color:var(--gold);background:rgba(212,175,55,.08)}
.stk{--sc:#1b5e3b;position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:112px;height:150px;border-radius:14px;background:radial-gradient(circle at 50% 38%,#fff 0,#f3efe4 70%);border:4px solid var(--sc);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 0 2px #fff;transform:rotate(-4deg);color:var(--sc)}
.msg.me .stk{transform:rotate(4deg)}
.stk .se{font-size:52px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.stk .st{margin-top:8px;font:900 14px Cairo,sans-serif;background:var(--sc);color:#fff;padding:2px 8px;border-radius:8px;max-width:96%;text-align:center;line-height:1.3}
.stk .cr{position:absolute;top:4px;right:7px;font-style:normal;font:700 18px Playfair Display,serif;color:#111}.stk .cr.r{color:#c0182c}.stk .cr.b{top:auto;right:auto;bottom:4px;left:7px;transform:rotate(180deg)}
.stk.sm{width:70px;height:94px;border-width:3px;border-radius:10px;transform:none}.stk.sm .se{font-size:30px}.stk.sm .st{font-size:9.5px;margin-top:4px;padding:1px 4px}.stk.sm .cr{font-size:12px}
.msg.stkm{background:none!important;border:none!important;box-shadow:none!important;padding:4px}
.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;max-height:38vh;overflow:auto;background:rgba(0,0,0,.25);border-top:1px solid var(--line)}.stkgrid button{background:none;border:none;padding:0;display:grid;place-items:center}
</style>
